pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  variables:
    - name: github_token
      type: Secret
      required: true
      value: <+input>
    - name: jira_project_key
      type: String
      required: false
      value: SCRUM
    - name: jira_parent_issue_type
      type: String
      required: false
      value: Epic
    - name: jira_child_issue_type
      type: String
      required: false
      value: Task
    - name: min_severity_for_demo
      type: String
      required: false
      value: low
  stages:
    - stage:
        name: Release_Queue
        identifier: Release_Queue
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Queue
                  name: Queue_Release_Version
                  identifier: Queue_Release_Version
                  spec:
                    key: cegeka-release-version
                    scope: Pipeline
                  timeout: 30m
              - step:
                  type: ShellScript
                  name: Generate_Release_Version
                  identifier: Generate_Release_Version
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e

                          echo "=============================================="
                          echo "GENERATING RELEASE VERSION"
                          echo "=============================================="

                          GITHUB_TOKEN="<+pipeline.variables.github_token>"

                          if [ -z "$GITHUB_TOKEN" ]; then
                            echo "ERROR: GITHUB_TOKEN is empty."
                            exit 1
                          fi

                          echo "Checking GitHub authentication..."

                          GITHUB_HTTP_CODE="$(curl -sS \
                            -o /tmp/github-user.json \
                            -w "%{http_code}" \
                            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                            -H "Accept: application/vnd.github+json" \
                            -H "X-GitHub-Api-Version: 2022-11-28" \
                            https://api.github.com/user)"

                          echo "GitHub HTTP status: $GITHUB_HTTP_CODE"

                          if [ "$GITHUB_HTTP_CODE" != "200" ]; then
                            echo "ERROR: GitHub authentication failed."
                            cat /tmp/github-user.json
                            exit 1
                          fi

                          GITHUB_USER="$(python3 -c '
                          import json
                          with open("/tmp/github-user.json") as f:
                              print(json.load(f).get("login", ""))
                          ')"

                          echo "GitHub authentication: SUCCESS"
                          echo "GitHub user: $GITHUB_USER"

                          GIT_REPO_URL="https://github.com/manjunathy-harness/cegeka-poc.git"
                          GIT_BRANCH="main"

                          echo "=============================================="
                          echo "CLONING REPOSITORY"
                          echo "=============================================="

                          rm -rf /tmp/cegeka-poc

                          git clone \
                            --branch "$GIT_BRANCH" \
                            --single-branch \
                            "$GIT_REPO_URL" \
                            /tmp/cegeka-poc

                          cd /tmp/cegeka-poc

                          echo "Repository cloned successfully."

                          echo "=============================================="
                          echo "CONFIGURING GIT CREDENTIALS"
                          echo "=============================================="

                          GIT_CREDENTIAL_FILE="/tmp/cegeka-git-credentials"

                          rm -f "$GIT_CREDENTIAL_FILE"

                          printf 'https://%s:%s@github.com\n' \
                            "$GITHUB_USER" \
                            "$GITHUB_TOKEN" \
                            > "$GIT_CREDENTIAL_FILE"

                          chmod 600 "$GIT_CREDENTIAL_FILE"

                          git config credential.helper \
                            "store --file=$GIT_CREDENTIAL_FILE"

                          export GIT_TERMINAL_PROMPT=0

                          echo "Git credential helper configured."

                          echo "=============================================="
                          echo "FETCHING GIT TAGS"
                          echo "=============================================="

                          git fetch --tags --force

                          LATEST_TAG="$(git tag --list \
                            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
                            | sort -V \
                            | tail -1 || true)"

                          echo "Latest release tag: ${LATEST_TAG:-none}"

                          echo "=============================================="
                          echo "CALCULATING NEXT RELEASE VERSION"
                          echo "=============================================="

                          if [ -z "$LATEST_TAG" ]; then
                            NEW_TAG="v1.0.0.1"
                          else
                            VERSION="$(echo "$LATEST_TAG" | sed 's/^v//')"

                            MAJOR="$(echo "$VERSION" | cut -d. -f1)"
                            MINOR="$(echo "$VERSION" | cut -d. -f2)"
                            PATCH="$(echo "$VERSION" | cut -d. -f3)"
                            BUILD="$(echo "$VERSION" | cut -d. -f4)"

                            NEXT_BUILD=$((BUILD + 1))

                            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}.${NEXT_BUILD}"
                          fi

                          RELEASE_NAME="$(echo "$NEW_TAG" | sed 's/^v//')"
                          COMMIT_SHA="$(git rev-parse HEAD)"

                          echo "=============================================="
                          echo "RELEASE INFORMATION"
                          echo "=============================================="
                          echo "Latest tag : ${LATEST_TAG:-none}"
                          echo "New tag    : $NEW_TAG"
                          echo "Release    : $RELEASE_NAME"
                          echo "Commit     : $COMMIT_SHA"
                          echo "=============================================="

                          if git ls-remote \
                            --exit-code \
                            --tags \
                            origin \
                            "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
                            echo "ERROR: Tag $NEW_TAG already exists."
                            rm -f "$GIT_CREDENTIAL_FILE"
                            exit 1
                          fi

                          echo "=============================================="
                          echo "CREATING GIT TAG"
                          echo "=============================================="

                          git config user.name "Harness Release Automation"
                          git config user.email "harness-release@harness.io"

                          git tag "$NEW_TAG" "$COMMIT_SHA"

                          echo "Git tag created locally: $NEW_TAG"

                          echo "=============================================="
                          echo "PUSHING GIT TAG"
                          echo "=============================================="

                          git push origin "$NEW_TAG"

                          echo "Git tag pushed successfully: $NEW_TAG"

                          if git ls-remote \
                            --exit-code \
                            --tags \
                            origin \
                            "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
                            echo "Remote tag verified: $NEW_TAG"
                          else
                            echo "ERROR: Remote tag verification failed."
                            rm -f "$GIT_CREDENTIAL_FILE"
                            exit 1
                          fi

                          rm -f "$GIT_CREDENTIAL_FILE"

                          echo "=============================================="
                          echo "RELEASE VERSION CREATED SUCCESSFULLY"
                          echo "=============================================="

                          echo "RELEASE_NAME=$RELEASE_NAME"
                          echo "RELEASE_TAG=$NEW_TAG"
                          echo "COMMIT_SHA=$COMMIT_SHA"
                    outputVariables:
                      - name: RELEASE_NAME
                        type: String
                        value: RELEASE_NAME
                      - name: RELEASE_TAG
                        type: String
                        value: NEW_TAG
                      - name: COMMIT_SHA
                        type: String
                        value: COMMIT_SHA
                  timeout: 10m
    - stage:
        name: Build_And_Scan
        identifier: Build_And_Scan
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      cd sample-app
                      npm install --package-lock-only
              - step:
                  type: Owasp
                  name: OWASP_Dependency_Check
                  identifier: OWASP_Dependency_Check
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      name: <+codebase.repoUrl>
                      variant: <+codebase.branch>
                      workspace: sample-app
                    advanced:
                      log:
                        level: info
                    privileged: true
              - step:
                  type: Run
                  name: Run_NPM_Audit
                  identifier: Run_NPM_Audit
                  spec:
                    shell: Sh
                    command: |-
                      cd sample-app
                      npm audit --json > /harness/npm-audit.json || true
                      cat /harness/npm-audit.json
              - step:
                  type: Run
                  name: Parse_Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.stages.Release_Queue.spec.execution.steps.Generate_Release_Version.output.outputVariables.RELEASE_NAME>
                      MIN_SEVERITY: <+pipeline.variables.min_severity_for_demo>
                    command: |-
                      set -e

                      SEVERITY_FLAG=""

                      if [ -n "$MIN_SEVERITY" ]; then
                        SEVERITY_FLAG="--min-severity $MIN_SEVERITY"
                      fi

                      python3 scripts/parse_npm_audit.py \
                        /harness/npm-audit.json \
                        "$RELEASE_NAME" \
                        $SEVERITY_FLAG \
                        > /harness/vuln_vars.env

                      cat /harness/vuln_vars.env

                      export RELEASE_NAME="$(grep '^RELEASE_NAME=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_COUNT="$(grep '^VULN_COUNT=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_ITEMS="$(grep '^VULN_ITEMS=' /harness/vuln_vars.env | cut -d= -f2-)"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "VULN_COUNT=$VULN_COUNT"
                      echo "VULN_ITEMS=$VULN_ITEMS"
                    outputVariables:
                      - name: RELEASE_NAME
                      - name: VULN_COUNT
                      - name: VULN_ITEMS
              - step:
                  type: Run
                  name: Generate_Release_Label
                  identifier: Generate_Release_Label
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.stages.Release_Queue.spec.execution.steps.Generate_Release_Version.output.outputVariables.RELEASE_NAME>
                    command: |-
                      set -e

                      SAFE_RELEASE_NAME="$(echo "$RELEASE_NAME" \
                        | tr '[:upper:]' '[:lower:]' \
                        | sed 's/[^a-z0-9]/-/g' \
                        | sed 's/--*/-/g' \
                        | sed 's/^-//; s/-$//')"

                      RELEASE_LABEL="security-release-${SAFE_RELEASE_NAME}"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "RELEASE_LABEL=$RELEASE_LABEL"

                      export RELEASE_LABEL
                    outputVariables:
                      - name: RELEASE_LABEL
              - step:
                  type: Run
                  name: Lookup_Existing_Jira_Epic
                  identifier: Lookup_Existing_Jira_Epic
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    shell: Sh
                    envVariables:
                      JIRA_API_BASE: https://api.atlassian.com/ex/jira/e7275a1a-f6bd-4b41-af99-c35820ea031b/rest/api/3
                      JIRA_EMAIL: <+secrets.getValue("cegeka_jira_email")>
                      JIRA_API_TOKEN: <+secrets.getValue("cegeka-poc-jira")>
                      RELEASE_NAME: <+pipeline.stages.Release_Queue.spec.execution.steps.Generate_Release_Version.output.outputVariables.RELEASE_NAME>
                      RELEASE_LABEL: <+execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                      JIRA_PROJECT_KEY: <+pipeline.variables.jira_project_key>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "JIRA EPIC LOOKUP"
                      echo "=============================================="

                      echo "PROJECT=$JIRA_PROJECT_KEY"
                      echo "RELEASE=$RELEASE_NAME"
                      echo "LABEL=$RELEASE_LABEL"

                      RESPONSE_FILE="/tmp/jira-response.json"

                      SEARCH_JQL="project = ${JIRA_PROJECT_KEY} AND issuetype = Epic ORDER BY created DESC"

                      echo "Executing Jira search..."

                      REQUEST_BODY="$(python3 -c '
                      import json
                      import os

                      body = {
                          "jql": os.environ["SEARCH_JQL"],
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "status",
                              "issuetype",
                              "labels"
                          ]
                      }

                      print(json.dumps(body))
                      ')"

                      HTTP_CODE="$(curl -sS \
                        -o "$RESPONSE_FILE" \
                        -w "%{http_code}" \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -X POST \
                        -H "Accept: application/json" \
                        -H "Content-Type: application/json" \
                        "${JIRA_API_BASE}/search/jql" \
                        --data "$REQUEST_BODY")"

                      echo "JIRA HTTP STATUS=$HTTP_CODE"

                      if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                        echo "ERROR: Jira search failed."
                        cat "$RESPONSE_FILE"
                        exit 1
                      fi

                      echo "Jira search successful."

                      export RESPONSE_FILE
                      export RELEASE_NAME
                      export RELEASE_LABEL

                      echo "=============================================="
                      echo "PARSING JIRA RESPONSE"
                      echo "=============================================="

                      python3 - <<'PY'
                      import json
                      import os
                      import sys

                      response_file = os.environ["RESPONSE_FILE"]
                      release_name = os.environ["RELEASE_NAME"].strip().lower()
                      release_label = os.environ["RELEASE_LABEL"].strip().lower()

                      try:
                          with open(response_file, "r", encoding="utf-8") as f:
                              data = json.load(f)
                      except Exception as e:
                          print("ERROR: Unable to parse Jira response.")
                          print(str(e))
                          sys.exit(1)

                      issues = data.get("issues", [])

                      print("TOTAL_EPICS_RETURNED=" + str(len(issues)))

                      epic_exists = "false"
                      epic_key = ""
                      epic_status = ""
                      epic_summary = ""

                      for issue in issues:
                          fields = issue.get("fields") or {}

                          issue_key = issue.get("key", "")

                          summary = fields.get("summary") or ""

                          status_object = fields.get("status") or {}
                          status = status_object.get("name", "")

                          issue_type_object = fields.get("issuetype") or {}
                          issue_type = issue_type_object.get("name", "")

                          labels = fields.get("labels") or []

                          if issue_type.lower() != "epic":
                              continue

                          if release_name in summary.lower():
                              epic_exists = "true"
                              epic_key = issue_key
                              epic_status = status
                              epic_summary = summary

                              print("MATCH_FOUND_BY_RELEASE_NAME")
                              break

                          normalized_labels = [
                              str(label).lower()
                              for label in labels
                          ]

                          if release_label in normalized_labels:
                              epic_exists = "true"
                              epic_key = issue_key
                              epic_status = status
                              epic_summary = summary

                              print("MATCH_FOUND_BY_RELEASE_LABEL")
                              break

                      print("EPIC_EXISTS=" + epic_exists)
                      print("EPIC_KEY=" + epic_key)
                      print("EPIC_STATUS=" + epic_status)
                      print("EPIC_SUMMARY=" + epic_summary)

                      with open("/tmp/jira_match.env", "w", encoding="utf-8") as f:
                          f.write("EPIC_EXISTS=" + epic_exists + "\n")
                          f.write("EPIC_KEY=" + epic_key + "\n")
                          f.write("EPIC_STATUS=" + epic_status + "\n")
                      PY

                      echo "=============================================="
                      echo "READING JIRA MATCH RESULT"
                      echo "=============================================="

                      if [ ! -f /tmp/jira_match.env ]; then
                        echo "ERROR: Jira match result file was not created."
                        exit 1
                      fi

                      cat /tmp/jira_match.env

                      . /tmp/jira_match.env

                      echo "=============================================="
                      echo "JIRA MATCH RESULT"
                      echo "=============================================="

                      echo "EPIC_EXISTS=$EPIC_EXISTS"
                      echo "EPIC_KEY=$EPIC_KEY"
                      echo "EPIC_STATUS=$EPIC_STATUS"

                      echo "=============================================="
                    outputVariables:
                      - name: EPIC_EXISTS
                      - name: EPIC_KEY
                      - name: EPIC_STATUS
    - stage:
        name: Jira_Automation
        identifier: Jira_Automation
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
        spec:
          execution:
            steps:
              - stepGroup:
                  name: Create_Jira_Tickets
                  identifier: Create_Jira_Tickets
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" || <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  steps:
                    - step:
                        type: JiraCreate
                        name: Create_Parent_Release_Ticket
                        identifier: Create_Parent_Release_Ticket
                        spec:
                          connectorRef: cegekapocjira
                          projectKey: <+pipeline.variables.jira_project_key>
                          issueType: <+pipeline.variables.jira_parent_issue_type>
                          fields:
                            - name: Reporter
                              value: manjunath.chavan2017@gmail.com
                            - name: Summary
                              value: Security scan results - <+pipeline.stages.Release_Queue.spec.execution.steps.Generate_Release_Version.output.outputVariables.RELEASE_NAME> - <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> vulnerabilities found
                            - name: Description
                              value: |-
                                Automated security scan for release <+pipeline.stages.Release_Queue.spec.execution.steps.Generate_Release_Version.output.outputVariables.RELEASE_NAME>.

                                Total vulnerabilities found: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>

                                Each vulnerability has been filed as a child ticket below.

                                Pipeline execution: <+pipeline.executionUrl>
                            - name: Labels
                              value: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                        timeout: 5m
                    - step:
                        type: JiraCreate
                        name: Create_Child_Vulnerability_Ticket
                        identifier: Create_Child_Vulnerability_Ticket
                        spec:
                          connectorRef: cegekapocjira
                          projectKey: <+pipeline.variables.jira_project_key>
                          issueType: <+pipeline.variables.jira_child_issue_type>
                          fields:
                            - name: Reporter
                              value: manjunath.chavan2017@gmail.com
                            - name: Summary
                              value: "[<+repeat.item.split(\"~\")[1]>] <+repeat.item.split(\"~\")[0]> in <+repeat.item.split(\"~\")[2]>"
                            - name: Description
                              value: |-
                                Advisory / CVE: <+repeat.item.split("~")[0]>
                                Severity: <+repeat.item.split("~")[1]>
                                Package: <+repeat.item.split("~")[2]>
                                Vulnerable range: <+repeat.item.split("~")[3]>
                                CVSS score: <+repeat.item.split("~")[4]>
                                Details: <+repeat.item.split("~")[5]>

                                Release: <+pipeline.stages.Release_Queue.spec.execution.steps.Generate_Release_Version.output.outputVariables.RELEASE_NAME>
                            - name: Parent
                              value: <+pipeline.stages.Jira_Automation.spec.execution.steps.Create_Jira_Tickets.steps.Create_Parent_Release_Ticket.issue.key>
                        timeout: 5m
                        failureStrategies:
                          - onFailure:
                              errors:
                                - AllErrors
                              action:
                                type: MarkAsSuccess
                        strategy:
                          repeat:
                            items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS.split("@@@").toString()>
                            maxConcurrency: 5
