pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  variables:
    - name: release_name
      type: String
      required: true
      value: <+input>
    - name: jira_project_key
      type: String
      required: false
      value: SCRUM
    - name: jira_parent_issue_type
      type: String
      required: false
      value: Epic
    - name: jira_child_issue_type
      type: String
      required: false
      value: Task
    - name: min_severity_for_demo
      type: String
      required: false
      value: low
  stages:
    - stage:
        name: Build_And_Scan
        identifier: Build_And_Scan
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      cd sample-app

                      echo "Installing dependencies..."
                      npm install --package-lock-only

                      echo ""
                      echo "Package versions:"
                      npm list --depth=0 || true
              - step:
                  type: Owasp
                  name: OWASP_Dependency_Check
                  identifier: OWASP_Dependency_Check
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      name: <+codebase.repoUrl>
                      variant: <+codebase.branch>
                      workspace: sample-app
                    advanced:
                      log:
                        level: info
                    privileged: true
              - step:
                  type: Run
                  name: Run_NPM_Audit
                  identifier: Run_NPM_Audit
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      cd sample-app

                      echo "Running npm audit..."

                      npm audit --json > /harness/npm-audit.json || true

                      echo ""
                      echo "================ NPM AUDIT OUTPUT ================"
                      cat /harness/npm-audit.json
                      echo ""
                      echo "===================================================="
              - step:
                  type: Run
                  name: Parse_Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      MIN_SEVERITY: <+pipeline.variables.min_severity_for_demo>
                    command: |-
                      set -e

                      echo "Release: $RELEASE_NAME"
                      echo "Minimum severity: $MIN_SEVERITY"

                      SEVERITY_FLAG=""

                      if [ -n "$MIN_SEVERITY" ]; then
                        SEVERITY_FLAG="--min-severity $MIN_SEVERITY"
                      fi

                      echo ""
                      echo "Running vulnerability parser..."

                      python3 scripts/parse_npm_audit.py \
                        /harness/npm-audit.json \
                        "$RELEASE_NAME" \
                        $SEVERITY_FLAG \
                        > /harness/vuln_vars.env

                      echo ""
                      echo "================ PARSED VARIABLES ================"
                      cat /harness/vuln_vars.env
                      echo "===================================================="

                      export RELEASE_NAME="$(grep '^RELEASE_NAME=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_COUNT="$(grep '^VULN_COUNT=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_ITEMS="$(grep '^VULN_ITEMS=' /harness/vuln_vars.env | cut -d= -f2-)"

                      echo ""
                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "VULN_COUNT=$VULN_COUNT"
                      echo "VULN_ITEMS=$VULN_ITEMS"
                    outputVariables:
                      - name: RELEASE_NAME
                      - name: VULN_COUNT
                      - name: VULN_ITEMS
              - step:
                  type: Run
                  name: Generate_Release_Label
                  identifier: Generate_Release_Label
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                    command: |-
                      set -e

                      SAFE_RELEASE_NAME="$(echo "$RELEASE_NAME" \
                        | tr '[:upper:]' '[:lower:]' \
                        | sed 's/[^a-z0-9]/-/g' \
                        | sed 's/--*/-/g' \
                        | sed 's/^-//; s/-$//')"

                      RELEASE_LABEL="security-release-${SAFE_RELEASE_NAME}"

                      echo "Release name : $RELEASE_NAME"
                      echo "Release label: $RELEASE_LABEL"

                      export RELEASE_LABEL
                    outputVariables:
                      - name: RELEASE_LABEL
              - step:
                  type: Run
                  name: Lookup_Existing_Jira_Epic
                  identifier: Lookup_Existing_Jira_Epic
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    shell: Sh
                    envVariables:
                      JIRA_URL: https://manjunath0328.atlassian.net
                      JIRA_EMAIL: <+secrets.getValue("cegeka_jira_email")>
                      JIRA_API_TOKEN: <+secrets.getValue("cegeka-poc-jira")>
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      RELEASE_LABEL: <+execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                      JIRA_PROJECT_KEY: <+pipeline.variables.jira_project_key>
                    command: |-
                      set -e

                      echo "===================================================="
                      echo "JIRA AUTHENTICATION DIAGNOSTIC"
                      echo "===================================================="

                      echo ""
                      echo "Jira URL:"
                      echo "$JIRA_URL"

                      echo ""
                      echo "Jira email configured:"
                      echo "$JIRA_EMAIL"

                      # ------------------------------------------------
                      # 1. Identify authenticated Jira account
                      # ------------------------------------------------

                      echo ""
                      echo "----------------------------------------------------"
                      echo "1. Calling Jira /myself"
                      echo "----------------------------------------------------"

                      MYSELF_RESPONSE="$(curl -sS \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -H "Accept: application/json" \
                        "${JIRA_URL}/rest/api/3/myself")"

                      echo "$MYSELF_RESPONSE"

                      MYSELF_ACCOUNT_ID="$(echo "$MYSELF_RESPONSE" \
                        | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("accountId",""))' 2>/dev/null || true)"

                      MYSELF_DISPLAY_NAME="$(echo "$MYSELF_RESPONSE" \
                        | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("displayName",""))' 2>/dev/null || true)"

                      MYSELF_EMAIL="$(echo "$MYSELF_RESPONSE" \
                        | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("emailAddress",""))' 2>/dev/null || true)"

                      echo ""
                      echo "Authenticated Jira account ID:"
                      echo "$MYSELF_ACCOUNT_ID"

                      echo ""
                      echo "Authenticated Jira display name:"
                      echo "$MYSELF_DISPLAY_NAME"

                      echo ""
                      echo "Authenticated Jira email:"
                      echo "$MYSELF_EMAIL"

                      if [ -z "$MYSELF_ACCOUNT_ID" ]; then
                        echo ""
                        echo "ERROR: Could not determine authenticated Jira account."
                        echo "Check JIRA_EMAIL and JIRA_API_TOKEN."
                        exit 1
                      fi

                      # ------------------------------------------------
                      # 2. Directly test known existing Epic
                      # ------------------------------------------------

                      echo ""
                      echo "===================================================="
                      echo "KNOWN EPIC VISIBILITY TEST"
                      echo "===================================================="

                      TEST_EPIC_KEY="SCRUM-1253"

                      echo ""
                      echo "Testing existing Jira issue:"
                      echo "$TEST_EPIC_KEY"

                      TEST_HTTP_STATUS="$(curl -sS \
                        -o /tmp/scrum-1253.json \
                        -w "%{http_code}" \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -H "Accept: application/json" \
                        "${JIRA_URL}/rest/api/3/issue/${TEST_EPIC_KEY}?fields=summary,status,issuetype,labels")"

                      echo ""
                      echo "HTTP status for $TEST_EPIC_KEY:"
                      echo "$TEST_HTTP_STATUS"

                      echo ""
                      echo "Jira response:"
                      cat /tmp/scrum-1253.json

                      # ------------------------------------------------
                      # Do NOT continue if API user cannot see issue
                      # ------------------------------------------------

                      if [ "$TEST_HTTP_STATUS" != "200" ]; then
                        echo ""
                        echo "===================================================="
                        echo "JIRA VISIBILITY TEST FAILED"
                        echo "===================================================="

                        echo ""
                        echo "The authenticated Jira user cannot retrieve $TEST_EPIC_KEY."

                        echo ""
                        echo "Possible causes:"
                        echo "1. Harness JIRA_EMAIL is not the Jira account you expect."
                        echo "2. The API token belongs to a different Jira account."
                        echo "3. The authenticated user does not have Browse Projects permission."
                        echo "4. Issue-level security prevents the issue from being viewed."
                        echo "5. Jira project permissions are restricting API visibility."

                        echo ""
                        echo "Pipeline will STOP here to prevent duplicate Jira Epics."

                        exit 1
                      fi

                      echo ""
                      echo "SUCCESS: API user can read $TEST_EPIC_KEY."

                      # ------------------------------------------------
                      # 3. Normal release lookup
                      # ------------------------------------------------

                      echo ""
                      echo "===================================================="
                      echo "SEARCHING FOR EXISTING RELEASE EPIC"
                      echo "===================================================="

                      echo ""
                      echo "Release name : $RELEASE_NAME"
                      echo "Release label: $RELEASE_LABEL"
                      echo "Project      : $JIRA_PROJECT_KEY"

                      JQL="project = ${JIRA_PROJECT_KEY} AND issuetype = Epic ORDER BY created DESC"

                      echo ""
                      echo "JQL:"
                      echo "$JQL"

                      REQUEST_BODY="$(python3 - "$JQL" <<'PY'
                      import json
                      import sys

                      jql = sys.argv[1]

                      body = {
                          "jql": jql,
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "status",
                              "issuetype",
                              "labels"
                          ]
                      }

                      print(json.dumps(body))
                      PY
                      )"

                      echo ""
                      echo "Sending Jira search request..."

                      HTTP_STATUS="$(curl -sS \
                        -o /tmp/jira-search-response.json \
                        -w "%{http_code}" \
                        -X POST \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -H "Accept: application/json" \
                        -H "Content-Type: application/json" \
                        "${JIRA_URL}/rest/api/3/search/jql" \
                        --data "$REQUEST_BODY")"

                      echo ""
                      echo "JIRA HTTP STATUS:"
                      echo "$HTTP_STATUS"

                      echo ""
                      echo "JIRA RESPONSE:"
                      cat /tmp/jira-search-response.json

                      if [ "$HTTP_STATUS" != "200" ]; then
                        echo ""
                        echo "ERROR: Jira search API returned HTTP $HTTP_STATUS."
                        echo "Pipeline will stop to prevent duplicate Epic creation."
                        exit 1
                      fi

                      # ------------------------------------------------
                      # 4. Match release by summary OR stable label
                      # ------------------------------------------------

                      python3 - \
                        /tmp/jira-search-response.json \
                        "$RELEASE_NAME" \
                        "$RELEASE_LABEL" \
                        > /harness/jira_lookup.env <<'PY'
                      import json
                      import sys

                      response_file = sys.argv[1]
                      release_name = sys.argv[2]
                      release_label = sys.argv[3]

                      with open(response_file, "r", encoding="utf-8") as f:
                          data = json.load(f)

                      issues = data.get("issues", [])

                      print(f"TOTAL_EPICS_RETURNED={len(issues)}")

                      matched = None

                      for issue in issues:
                          fields = issue.get("fields", {})

                          key = issue.get("key", "")

                          summary = fields.get("summary", "") or ""

                          labels = fields.get("labels", []) or []

                          status_obj = fields.get("status") or {}

                          status_name = status_obj.get("name", "") or ""

                          issue_type_obj = fields.get("issuetype") or {}

                          issue_type = issue_type_obj.get("name", "") or ""

                          print(
                              f"EPIC_CANDIDATE "
                              f"key={key} "
                              f"summary={summary} "
                              f"status={status_name} "
                              f"labels={labels} "
                              f"issuetype={issue_type}"
                          )

                          if issue_type.lower() != "epic":
                              continue

                          summary_match = release_name in summary

                          label_match = release_label in labels

                          if summary_match or label_match:
                              matched = {
                                  "key": key,
                                  "summary": summary,
                                  "status": status_name,
                                  "labels": labels
                              }
                              break

                      if matched:
                          print("")
                          print("MATCHED_EXISTING_EPIC=true")
                          print(f"EPIC_EXISTS=true")
                          print(f"EPIC_KEY={matched['key']}")
                          print(f"EPIC_STATUS={matched['status']}")
                          print(f"EPIC_SUMMARY={matched['summary']}")

                      else:
                          print("")
                          print("NO_MATCHING_RELEASE_EPIC_FOUND")
                          print("EPIC_EXISTS=false")
                          print("EPIC_KEY=")
                          print("EPIC_STATUS=")
                          print("EPIC_SUMMARY=")
                      PY

                      echo ""
                      echo "===================================================="
                      echo "JIRA LOOKUP RESULT"
                      echo "===================================================="

                      cat /harness/jira_lookup.env

                      # ------------------------------------------------
                      # 5. Export Harness output variables
                      # ------------------------------------------------

                      export EPIC_EXISTS="$(grep '^EPIC_EXISTS=' /harness/jira_lookup.env | cut -d= -f2-)"
                      export EPIC_KEY="$(grep '^EPIC_KEY=' /harness/jira_lookup.env | cut -d= -f2-)"
                      export EPIC_STATUS="$(grep '^EPIC_STATUS=' /harness/jira_lookup.env | cut -d= -f2-)"

                      echo ""
                      echo "===================================================="
                      echo "FINAL JIRA DECISION"
                      echo "===================================================="

                      echo "EPIC_EXISTS=$EPIC_EXISTS"
                      echo "EPIC_KEY=$EPIC_KEY"
                      echo "EPIC_STATUS=$EPIC_STATUS"

                      # ------------------------------------------------
                      # Safety check
                      # Never silently treat a malformed lookup as false
                      # ------------------------------------------------

                      if [ -z "$EPIC_EXISTS" ]; then
                        echo ""
                        echo "ERROR: EPIC_EXISTS was not populated."
                        echo "Stopping pipeline to prevent duplicate Jira creation."
                        exit 1
                      fi
                    outputVariables:
                      - name: EPIC_EXISTS
                      - name: EPIC_KEY
                      - name: EPIC_STATUS
                      - name: EPIC_SUMMARY
    - stage:
        name: Jira_Automation
        identifier: Jira_Automation
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
        spec:
          execution:
            steps:
              - step:
                  type: JiraCreate
                  name: Create_Parent_Release_Ticket
                  identifier: Create_Parent_Release_Ticket
                  when:
                    stageStatus: Success
                    condition: |-
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" ||
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_parent_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: Security scan results - <+pipeline.variables.release_name> - <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> vulnerabilities found
                      - name: Description
                        value: |-
                          Automated security scan for release <+pipeline.variables.release_name>.

                          Total vulnerabilities found:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>

                          Each vulnerability has been filed as a linked child ticket below.

                          Release label:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>

                          Pipeline execution:
                          <+pipeline.executionUrl>
                      - name: Labels
                        value: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                  timeout: 5m
              - step:
                  type: JiraCreate
                  name: Create_Child_Tickets_New_Epic
                  identifier: Create_Child_Tickets_New_Epic
                  when:
                    stageStatus: Success
                    condition: |-
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" ||
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_child_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: "[<+repeat.item.split(\"~\")[1]>] <+repeat.item.split(\"~\")[0]> in <+repeat.item.split(\"~\")[2]>"
                      - name: Description
                        value: |-
                          Advisory / CVE:
                          <+repeat.item.split("~")[0]>

                          Severity:
                          <+repeat.item.split("~")[1]>

                          Package:
                          <+repeat.item.split("~")[2]>

                          Vulnerable range:
                          <+repeat.item.split("~")[3]>

                          CVSS score:
                          <+repeat.item.split("~")[4]>

                          Details:
                          <+repeat.item.split("~")[5]>

                          Release:
                          <+pipeline.variables.release_name>

                          Release label:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>

                          Pipeline:
                          <+pipeline.executionUrl>
                      - name: Parent
                        value: <+pipeline.stages.Jira_Automation.spec.execution.steps.Create_Parent_Release_Ticket.issue.key>
                    timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  strategy:
                    repeat:
                      items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS.split("@@@")>
                      maxConcurrency: 5
              - step:
                  type: JiraCreate
                  name: Create_Child_Tickets_Existing_Epic
                  identifier: Create_Child_Tickets_Existing_Epic
                  when:
                    stageStatus: Success
                    condition: |-
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "true" &&
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> != "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_child_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: "[<+repeat.item.split(\"~\")[1]>] <+repeat.item.split(\"~\")[0]> in <+repeat.item.split(\"~\")[2]>"
                      - name: Description
                        value: |-
                          Advisory / CVE:
                          <+repeat.item.split("~")[0]>

                          Severity:
                          <+repeat.item.split("~")[1]>

                          Package:
                          <+repeat.item.split("~")[2]>

                          Vulnerable range:
                          <+repeat.item.split("~")[3]>

                          CVSS score:
                          <+repeat.item.split("~")[4]>

                          Details:
                          <+repeat.item.split("~")[5]>

                          Release:
                          <+pipeline.variables.release_name>

                          Release label:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>

                          Pipeline:
                          <+pipeline.executionUrl>
                      - name: Parent
                        value: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_KEY>
                    timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  strategy:
                    repeat:
                      items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS.split("@@@")>
                      maxConcurrency: 5
