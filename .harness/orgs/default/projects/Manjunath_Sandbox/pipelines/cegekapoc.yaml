pipeline:
  name: Cegeka POC
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Jira_Auth_Test
        identifier: Jira_Auth_Test
        description: Test Jira authentication only
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Test_Jira_Authentication
                  identifier: Test_Jira_Authentication
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -e

                          echo "=============================================="
                          echo "JIRA AUTHENTICATION TEST"
                          echo "=============================================="

                          JIRA_EMAIL="<+secrets.getValue('cegeka_jira_email')>"
                          JIRA_API_TOKEN="<+secrets.getValue('cegeka-poc-jira')>"

                          JIRA_API_BASE="https://api.atlassian.com/ex/jira/e7275a1a-f6bd-4b41-af99-c35820ea031b/rest/api/3"

                          echo "JIRA EMAIL: ${JIRA_EMAIL}"
                          echo "TOKEN LENGTH: ${#JIRA_API_TOKEN}"
                          echo "TOKEN PREFIX: ${JIRA_API_TOKEN:0:8}"

                          echo "=============================================="
                          echo "TESTING JIRA /myself"
                          echo "=============================================="

                          HTTP_STATUS="$(curl -sS \
                            -o /tmp/jira-response.json \
                            -w "%{http_code}" \
                            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                            -H "Accept: application/json" \
                            "${JIRA_API_BASE}/myself")"

                          echo "JIRA HTTP STATUS: ${HTTP_STATUS}"

                          echo "=============================================="
                          echo "JIRA RESPONSE"
                          echo "=============================================="

                          cat /tmp/jira-response.json

                          echo ""
                          echo "=============================================="

                          if [ "$HTTP_STATUS" = "200" ]; then
                            echo "JIRA AUTHENTICATION: SUCCESS"
                            echo "=============================================="
                          else
                            echo "JIRA AUTHENTICATION: FAILED"
                            echo "=============================================="
                            exit 1
                          fi
                    environmentVariables: []
