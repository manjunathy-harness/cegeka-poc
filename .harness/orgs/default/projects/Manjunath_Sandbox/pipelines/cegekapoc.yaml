pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  variables:
    - name: release_name
      type: String
      required: true
      value: <+input>
    - name: jira_project_key
      type: String
      required: false
      value: SCRUM
    - name: jira_parent_issue_type
      type: String
      required: false
      value: Epic
    - name: jira_child_issue_type
      type: String
      required: false
      value: Task
    - name: min_severity_for_demo
      type: String
      required: false
      value: low
  stages:
    - stage:
        name: Build_And_Scan
        identifier: Build_And_Scan
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      cd sample-app

                      echo "=============================================="
                      echo "INSTALLING DEPENDENCIES"
                      echo "=============================================="

                      npm install --package-lock-only

                      echo ""
                      echo "Installed packages:"
                      npm list --depth=0 || true
              - step:
                  type: Owasp
                  name: OWASP_Dependency_Check
                  identifier: OWASP_Dependency_Check
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      name: <+codebase.repoUrl>
                      variant: <+codebase.branch>
                      workspace: sample-app
                    advanced:
                      log:
                        level: info
                    privileged: true
              - step:
                  type: Run
                  name: Run_NPM_Audit
                  identifier: Run_NPM_Audit
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      cd sample-app

                      echo "=============================================="
                      echo "RUNNING NPM AUDIT"
                      echo "=============================================="

                      npm audit --json > /harness/npm-audit.json || true

                      echo ""
                      echo "=============================================="
                      echo "NPM AUDIT RESULT"
                      echo "=============================================="

                      cat /harness/npm-audit.json
              - step:
                  type: Run
                  name: Parse_Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      MIN_SEVERITY: <+pipeline.variables.min_severity_for_demo>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "PARSING VULNERABILITIES"
                      echo "=============================================="

                      echo "Release      : $RELEASE_NAME"
                      echo "Min severity : $MIN_SEVERITY"

                      SEVERITY_FLAG=""

                      if [ -n "$MIN_SEVERITY" ]; then
                        SEVERITY_FLAG="--min-severity $MIN_SEVERITY"
                      fi

                      python3 scripts/parse_npm_audit.py \
                        /harness/npm-audit.json \
                        "$RELEASE_NAME" \
                        $SEVERITY_FLAG \
                        > /harness/vuln_vars.env

                      echo ""
                      echo "=============================================="
                      echo "PARSED VARIABLES"
                      echo "=============================================="

                      cat /harness/vuln_vars.env

                      export RELEASE_NAME="$(grep '^RELEASE_NAME=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_COUNT="$(grep '^VULN_COUNT=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_ITEMS="$(grep '^VULN_ITEMS=' /harness/vuln_vars.env | cut -d= -f2-)"

                      echo ""
                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "VULN_COUNT=$VULN_COUNT"
                      echo "VULN_ITEMS=$VULN_ITEMS"
                    outputVariables:
                      - name: RELEASE_NAME
                      - name: VULN_COUNT
                      - name: VULN_ITEMS
              - step:
                  type: Run
                  name: Generate_Release_Label
                  identifier: Generate_Release_Label
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "GENERATING RELEASE LABEL"
                      echo "=============================================="

                      SAFE_RELEASE_NAME="$(echo "$RELEASE_NAME" \
                        | tr '[:upper:]' '[:lower:]' \
                        | sed 's/[^a-z0-9]/-/g' \
                        | sed 's/--*/-/g' \
                        | sed 's/^-//; s/-$//')"

                      RELEASE_LABEL="security-release-${SAFE_RELEASE_NAME}"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "RELEASE_LABEL=$RELEASE_LABEL"

                      export RELEASE_LABEL
                    outputVariables:
                      - name: RELEASE_LABEL
              - step:
                  type: Run
                  name: Lookup_Existing_Jira_Epic
                  identifier: Lookup_Existing_Jira_Epic
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    shell: Sh
                    envVariables:
                      JIRA_URL: https://api.atlassian.com/ex/jira/e7275a1a-f6bd-4b41-af99-c35820ea031b
                      JIRA_EMAIL: <+secrets.getValue("cegeka_jira_email")>
                      JIRA_API_TOKEN: <+secrets.getValue("cegeka-poc-jira")>
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      RELEASE_LABEL: <+execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                      JIRA_PROJECT_KEY: <+pipeline.variables.jira_project_key>
                    command: |-
                      set -e

                      echo "===================================================="
                      echo "JIRA AUTHENTICATION DIAGNOSTIC"
                      echo "===================================================="

                      echo ""
                      echo "Jira API URL:"
                      echo "$JIRA_URL"

                      echo ""
                      echo "Jira email configured:"
                      echo "$JIRA_EMAIL"

                      # ==================================================
                      # 1. TEST JIRA AUTHENTICATION
                      # ==================================================

                      echo ""
                      echo "----------------------------------------------------"
                      echo "1. Calling Jira /myself"
                      echo "----------------------------------------------------"

                      MYSELF_HTTP_STATUS="$(curl -sS \
                        -o /tmp/jira-myself.json \
                        -w "%{http_code}" \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -H "Accept: application/json" \
                        "${JIRA_URL}/rest/api/3/myself")"

                      echo ""
                      echo "Jira /myself HTTP status:"
                      echo "$MYSELF_HTTP_STATUS"

                      echo ""
                      echo "Jira /myself response:"
                      cat /tmp/jira-myself.json

                      if [ "$MYSELF_HTTP_STATUS" != "200" ]; then
                        echo ""
                        echo "===================================================="
                        echo "JIRA AUTHENTICATION FAILED"
                        echo "===================================================="

                        echo ""
                        echo "The Jira API rejected the credentials."

                        echo ""
                        echo "Pipeline will stop to prevent duplicate Jira creation."

                        exit 1
                      fi

                      echo ""
                      echo "JIRA AUTHENTICATION SUCCESSFUL"

                      # ==================================================
                      # 2. TEST KNOWN EXISTING EPIC
                      # ==================================================

                      echo ""
                      echo "===================================================="
                      echo "KNOWN EPIC VISIBILITY TEST"
                      echo "===================================================="

                      TEST_EPIC_KEY="SCRUM-1253"

                      echo ""
                      echo "Testing Jira issue:"
                      echo "$TEST_EPIC_KEY"

                      TEST_HTTP_STATUS="$(curl -sS \
                        -o /tmp/test-epic.json \
                        -w "%{http_code}" \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -H "Accept: application/json" \
                        "${JIRA_URL}/rest/api/3/issue/${TEST_EPIC_KEY}?fields=summary,status,issuetype,labels")"

                      echo ""
                      echo "HTTP status for $TEST_EPIC_KEY:"
                      echo "$TEST_HTTP_STATUS"

                      echo ""
                      echo "Jira response:"
                      cat /tmp/test-epic.json

                      if [ "$TEST_HTTP_STATUS" != "200" ]; then
                        echo ""
                        echo "===================================================="
                        echo "JIRA ISSUE VISIBILITY TEST FAILED"
                        echo "===================================================="

                        echo ""
                        echo "Authentication succeeded."
                        echo "However, the API user cannot read $TEST_EPIC_KEY."

                        echo ""
                        echo "Pipeline will stop to prevent duplicate Jira creation."

                        exit 1
                      fi

                      echo ""
                      echo "SUCCESS: $TEST_EPIC_KEY is accessible."

                      # ==================================================
                      # 3. SEARCH EXISTING EPICS
                      # ==================================================

                      echo ""
                      echo "===================================================="
                      echo "SEARCHING FOR EXISTING RELEASE EPIC"
                      echo "===================================================="

                      echo ""
                      echo "Release name:"
                      echo "$RELEASE_NAME"

                      echo ""
                      echo "Release label:"
                      echo "$RELEASE_LABEL"

                      echo ""
                      echo "Jira project:"
                      echo "$JIRA_PROJECT_KEY"

                      JQL="project = ${JIRA_PROJECT_KEY} AND issuetype = Epic ORDER BY created DESC"

                      echo ""
                      echo "JQL:"
                      echo "$JQL"

                      export SEARCH_JQL="$JQL"

                      REQUEST_BODY="$(python3 - <<'PY'
                      import json
                      import os

                      body = {
                          "jql": os.environ["SEARCH_JQL"],
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "status",
                              "issuetype",
                              "labels"
                          ]
                      }

                      print(json.dumps(body))
                      PY
                      )"

                      echo ""
                      echo "Sending Jira search request..."

                      HTTP_CODE="$(curl -sS \
                        -o /tmp/jira-search-response.json \
                        -w "%{http_code}" \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -X POST \
                        -H "Accept: application/json" \
                        -H "Content-Type: application/json" \
                        "${JIRA_URL}/rest/api/3/search/jql" \
                        --data "$REQUEST_BODY")"

                      echo ""
                      echo "JIRA SEARCH HTTP STATUS:"
                      echo "$HTTP_CODE"

                      echo ""
                      echo "JIRA SEARCH RESPONSE:"
                      cat /tmp/jira-search-response.json

                      if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                        echo ""
                        echo "ERROR: Jira search failed."
                        echo "Pipeline will stop to prevent duplicate Jira creation."
                        exit 1
                      fi

                      # ==================================================
                      # 4. FIND RELEASE EPIC
                      # ==================================================

                      export RESPONSE_FILE="/tmp/jira-search-response.json"

                      MATCH_RESULT="$(python3 - <<'PY'
                      import json
                      import os

                      response_file = os.environ["RESPONSE_FILE"]
                      release_name = os.environ.get("RELEASE_NAME", "").strip().lower()
                      release_label = os.environ.get("RELEASE_LABEL", "").strip().lower()

                      with open(response_file, "r", encoding="utf-8") as f:
                          data = json.load(f)

                      issues = data.get("issues", [])

                      print(f"TOTAL_EPICS_RETURNED={len(issues)}")

                      for issue in issues:

                          key = issue.get("key", "")

                          fields = issue.get("fields", {})

                          summary = fields.get("summary", "") or ""

                          status = (
                              fields.get("status", {}) or {}
                          ).get("name", "")

                          issue_type = (
                              fields.get("issuetype", {}) or {}
                          ).get("name", "")

                          labels = fields.get("labels", []) or []

                          print(
                              f"EPIC_CHECK "
                              f"key={key} "
                              f"type={issue_type} "
                              f"status={status} "
                              f"summary={summary} "
                              f"labels={labels}"
                          )

                          if issue_type.lower() != "epic":
                              continue

                          summary_match = (
                              release_name != ""
                              and release_name in summary.lower()
                          )

                          label_match = any(
                              str(label).lower() == release_label
                              for label in labels
                          )

                          if summary_match or label_match:

                              print("MATCH_FOUND=true")
                              print("EPIC_EXISTS=true")
                              print(f"EPIC_KEY={key}")
                              print(f"EPIC_STATUS={status}")
                              print(f"EPIC_SUMMARY={summary}")

                              raise SystemExit(0)

                      print("NO_MATCHING_RELEASE_EPIC_FOUND")
                      print("EPIC_EXISTS=false")
                      print("EPIC_KEY=")
                      print("EPIC_STATUS=")
                      print("EPIC_SUMMARY=")
                      PY
                      )"

                      echo ""
                      echo "===================================================="
                      echo "JIRA MATCH RESULT"
                      echo "===================================================="

                      echo "$MATCH_RESULT"

                      # ==================================================
                      # 5. EXPORT RESULTS
                      # ==================================================

                      EPIC_EXISTS="$(echo "$MATCH_RESULT" \
                        | grep '^EPIC_EXISTS=' \
                        | cut -d= -f2- || true)"

                      EPIC_KEY="$(echo "$MATCH_RESULT" \
                        | grep '^EPIC_KEY=' \
                        | cut -d= -f2- || true)"

                      EPIC_STATUS="$(echo "$MATCH_RESULT" \
                        | grep '^EPIC_STATUS=' \
                        | cut -d= -f2- || true)"

                      EPIC_SUMMARY="$(echo "$MATCH_RESULT" \
                        | grep '^EPIC_SUMMARY=' \
                        | cut -d= -f2- || true)"

                      # ==================================================
                      # SAFETY CHECK
                      # ==================================================

                      if [ -z "$EPIC_EXISTS" ]; then

                        echo ""
                        echo "===================================================="
                        echo "SAFETY CHECK FAILED"
                        echo "===================================================="

                        echo ""
                        echo "EPIC_EXISTS was not populated."

                        echo ""
                        echo "Stopping pipeline to prevent duplicate Jira creation."

                        exit 1
                      fi

                      echo ""
                      echo "===================================================="
                      echo "FINAL JIRA LOOKUP RESULT"
                      echo "===================================================="

                      echo "EPIC_EXISTS=$EPIC_EXISTS"
                      echo "EPIC_KEY=$EPIC_KEY"
                      echo "EPIC_STATUS=$EPIC_STATUS"
                      echo "EPIC_SUMMARY=$EPIC_SUMMARY"

                      export EPIC_EXISTS
                      export EPIC_KEY
                      export EPIC_STATUS
                      export EPIC_SUMMARY
                    outputVariables:
                      - name: EPIC_EXISTS
                      - name: EPIC_KEY
                      - name: EPIC_STATUS
                      - name: EPIC_SUMMARY
    - stage:
        name: Jira_Automation
        identifier: Jira_Automation
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
        spec:
          execution:
            steps:
              - step:
                  type: JiraCreate
                  name: Create_Parent_Release_Ticket
                  identifier: Create_Parent_Release_Ticket
                  when:
                    stageStatus: Success
                    condition: |-
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" ||
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_parent_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: Security scan results - <+pipeline.variables.release_name> - <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> vulnerabilities found
                      - name: Description
                        value: |-
                          Automated security scan for release <+pipeline.variables.release_name>.

                          Total vulnerabilities found:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>

                          Release label:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>

                          Each vulnerability has been filed as a child ticket below.

                          Pipeline execution:
                          <+pipeline.executionUrl>
                      - name: Labels
                        value: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                  timeout: 5m
              - step:
                  type: JiraCreate
                  name: Create_Child_Tickets_New_Epic
                  identifier: Create_Child_Tickets_New_Epic
                  when:
                    stageStatus: Success
                    condition: |-
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" ||
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_child_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: "[<+repeat.item.split(\"~\")[1]>] <+repeat.item.split(\"~\")[0]> in <+repeat.item.split(\"~\")[2]>"
                      - name: Description
                        value: |-
                          Advisory / CVE:
                          <+repeat.item.split("~")[0]>

                          Severity:
                          <+repeat.item.split("~")[1]>

                          Package:
                          <+repeat.item.split("~")[2]>

                          Vulnerable range:
                          <+repeat.item.split("~")[3]>

                          CVSS score:
                          <+repeat.item.split("~")[4]>

                          Details:
                          <+repeat.item.split("~")[5]>

                          Release:
                          <+pipeline.variables.release_name>

                          Release label:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>

                          Pipeline:
                          <+pipeline.executionUrl>
                      - name: Parent
                        value: <+pipeline.stages.Jira_Automation.spec.execution.steps.Create_Parent_Release_Ticket.issue.key>
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  strategy:
                    repeat:
                      items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS.split("@@@")>
                      maxConcurrency: 5
              - step:
                  type: JiraCreate
                  name: Create_Child_Tickets_Existing_Epic
                  identifier: Create_Child_Tickets_Existing_Epic
                  when:
                    stageStatus: Success
                    condition: |-
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "true" &&
                      <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> != "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_child_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: "[<+repeat.item.split(\"~\")[1]>] <+repeat.item.split(\"~\")[0]> in <+repeat.item.split(\"~\")[2]>"
                      - name: Description
                        value: |-
                          Advisory / CVE:
                          <+repeat.item.split("~")[0]>

                          Severity:
                          <+repeat.item.split("~")[1]>

                          Package:
                          <+repeat.item.split("~")[2]>

                          Vulnerable range:
                          <+repeat.item.split("~")[3]>

                          CVSS score:
                          <+repeat.item.split("~")[4]>

                          Details:
                          <+repeat.item.split("~")[5]>

                          Release:
                          <+pipeline.variables.release_name>

                          Release label:
                          <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>

                          Pipeline:
                          <+pipeline.executionUrl>
                      - name: Parent
                        value: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_KEY>
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  strategy:
                    repeat:
                      items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS.split("@@@")>
                      maxConcurrency: 5
