pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  variables:
    - name: release_name
      type: String
      required: true
      value: <+input>
    - name: jira_project_key
      type: String
      required: false
      value: SCRUM
    - name: jira_parent_issue_type
      type: String
      required: false
      value: Epic
    - name: jira_child_issue_type
      type: String
      required: false
      value: Task
    - name: min_severity_for_demo
      type: String
      required: false
      value: low
  stages:
    - stage:
        name: Build_And_Scan
        identifier: Build_And_Scan
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      cd sample-app
                      npm install --package-lock-only
              - step:
                  type: Owasp
                  name: OWASP_Dependency_Check
                  identifier: OWASP_Dependency_Check
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      name: <+codebase.repoUrl>
                      variant: <+codebase.branch>
                      workspace: sample-app
                    advanced:
                      log:
                        level: info
                    privileged: true
              - step:
                  type: Run
                  name: Run_NPM_Audit
                  identifier: Run_NPM_Audit
                  spec:
                    shell: Sh
                    command: |-
                      cd sample-app
                      npm audit --json > /harness/npm-audit.json || true
                      cat /harness/npm-audit.json
              - step:
                  type: Run
                  name: Parse_Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      MIN_SEVERITY: <+pipeline.variables.min_severity_for_demo>
                    command: |-
                      set -e
                      SEVERITY_FLAG=""
                      if [ -n "$MIN_SEVERITY" ]; then
                        SEVERITY_FLAG="--min-severity $MIN_SEVERITY"
                      fi

                      python3 scripts/parse_npm_audit.py \
                        /harness/npm-audit.json \
                        "$RELEASE_NAME" \
                        $SEVERITY_FLAG \
                        > /harness/vuln_vars.env

                      cat /harness/vuln_vars.env

                      export RELEASE_NAME="$(grep '^RELEASE_NAME=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_COUNT="$(grep '^VULN_COUNT=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_ITEMS="$(grep '^VULN_ITEMS=' /harness/vuln_vars.env | cut -d= -f2-)"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "VULN_COUNT=$VULN_COUNT"
                      echo "VULN_ITEMS=$VULN_ITEMS"
                    outputVariables:
                      - name: RELEASE_NAME
                      - name: VULN_COUNT
                      - name: VULN_ITEMS
              - step:
                  type: Run
                  name: Generate_Release_Label
                  identifier: Generate_Release_Label
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                    command: |-
                      set -e

                      SAFE_RELEASE_NAME="$(echo "$RELEASE_NAME" \
                        | tr '[:upper:]' '[:lower:]' \
                        | sed 's/[^a-z0-9]/-/g' \
                        | sed 's/--*/-/g' \
                        | sed 's/^-//; s/-$//')"

                      RELEASE_LABEL="security-release-${SAFE_RELEASE_NAME}"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "RELEASE_LABEL=$RELEASE_LABEL"

                      export RELEASE_LABEL
                    outputVariables:
                      - name: RELEASE_LABEL
              - step:
                  type: Run
                  name: Lookup_Existing_Jira_Epic
                  identifier: Lookup_Existing_Jira_Epic
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    shell: Sh
                    envVariables:
                      JIRA_API_BASE: https://api.atlassian.com/ex/jira/e7275a1a-f6bd-4b41-af99-c35820ea031b/rest/api/3
                      JIRA_EMAIL: <+secrets.getValue("cegeka_jira_email")>
                      JIRA_API_TOKEN: <+secrets.getValue("cegeka-poc-jira")>
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      RELEASE_LABEL: <+execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                      JIRA_PROJECT_KEY: <+pipeline.variables.jira_project_key>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "JIRA EPIC LOOKUP"
                      echo "=============================================="
                      echo "PROJECT=$JIRA_PROJECT_KEY"
                      echo "RELEASE=$RELEASE_NAME"
                      echo "LABEL=$RELEASE_LABEL"
                      echo "=============================================="

                      RESPONSE_FILE="/tmp/jira-response.json"

                      export SEARCH_JQL="project = ${JIRA_PROJECT_KEY} AND issuetype = Epic ORDER BY created DESC"

                      REQUEST_BODY="$(python3 - <<'PY'
                      import json
                      import os

                      body = {
                          "jql": os.environ["SEARCH_JQL"],
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "status",
                              "issuetype",
                              "labels"
                          ]
                      }

                      print(json.dumps(body))
                      PY
                      )"

                      HTTP_CODE="$(curl -sS \
                        -o "$RESPONSE_FILE" \
                        -w "%{http_code}" \
                        -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                        -X POST \
                        -H "Accept: application/json" \
                        -H "Content-Type: application/json" \
                        "${JIRA_API_BASE}/search/jql" \
                        --data "$REQUEST_BODY")"

                      echo "JIRA HTTP STATUS=$HTTP_CODE"

                      if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                        echo "ERROR: Jira search failed."
                        cat "$RESPONSE_FILE"
                        exit 1
                      fi

                      export RESPONSE_FILE
                      export RELEASE_NAME
                      export RELEASE_LABEL

                      MATCH_RESULT="$(python3 - <<'PY'
                      import json
                      import os

                      with open(os.environ["RESPONSE_FILE"], "r", encoding="utf-8") as f:
                          data = json.load(f)

                      release_name = os.environ["RELEASE_NAME"].strip().lower()
                      release_label = os.environ["RELEASE_LABEL"].strip().lower()

                      issues = data.get("issues", [])

                      print(f"TOTAL_EPICS_RETURNED={len(issues)}")

                      for issue in issues:
                          key = issue.get("key", "")
                          fields = issue.get("fields", {})

                          summary = fields.get("summary", "") or ""
                          status = (fields.get("status", {}) or {}).get("name", "")
                          issue_type = (fields.get("issuetype", {}) or {}).get("name", "")
                          labels = fields.get("labels", []) or []

                          if issue_type.lower() != "epic":
                              continue

                          if release_name in summary.lower():
                              print("MATCH_FOUND_BY_RELEASE_NAME")
                              print("EPIC_EXISTS=true")
                              print(f"EPIC_KEY={key}")
                              print(f"EPIC_STATUS={status}")
                              print(f"EPIC_SUMMARY={summary}")
                              raise SystemExit(0)

                          if release_label in [str(x).lower() for x in labels]:
                              print("MATCH_FOUND_BY_RELEASE_LABEL")
                              print("EPIC_EXISTS=true")
                              print(f"EPIC_KEY={key}")
                              print(f"EPIC_STATUS={status}")
                              print(f"EPIC_SUMMARY={summary}")
                              raise SystemExit(0)

                      print("NO_MATCHING_RELEASE_EPIC_FOUND")
                      print("EPIC_EXISTS=false")
                      print("EPIC_KEY=")
                      print("EPIC_STATUS=")
                      print("EPIC_SUMMARY=")
                      PY
                      )"

                      echo "=============================================="
                      echo "MATCH RESULT"
                      echo "$MATCH_RESULT"
                      echo "=============================================="

                      export EPIC_EXISTS="$(echo "$MATCH_RESULT" | grep '^EPIC_EXISTS=' | cut -d= -f2- || true)"
                      export EPIC_KEY="$(echo "$MATCH_RESULT" | grep '^EPIC_KEY=' | cut -d= -f2- || true)"
                      export EPIC_STATUS="$(echo "$MATCH_RESULT" | grep '^EPIC_STATUS=' | cut -d= -f2- || true)"

                      if [ -z "$EPIC_EXISTS" ]; then
                        EPIC_EXISTS="false"
                      fi

                      echo "EPIC_EXISTS=$EPIC_EXISTS"
                      echo "EPIC_KEY=$EPIC_KEY"
                      echo "EPIC_STATUS=$EPIC_STATUS"

                      export EPIC_EXISTS
                      export EPIC_KEY
                      export EPIC_STATUS
                    outputVariables:
                      - name: EPIC_EXISTS
                      - name: EPIC_KEY
                      - name: EPIC_STATUS
    - stage:
        name: Jira_Automation
        identifier: Jira_Automation
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
        spec:
          execution:
            steps:
              - step:
                  type: JiraCreate
                  name: Create_Parent_Release_Ticket
                  identifier: Create_Parent_Release_Ticket
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" || <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_parent_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: Security scan results - <+pipeline.variables.release_name> - <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> vulnerabilities found
                      - name: Description
                        value: |-
                          Automated security scan for release <+pipeline.variables.release_name>.

                          Total vulnerabilities found: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>

                          Each vulnerability has been filed as a child ticket below.

                          Pipeline execution: <+pipeline.executionUrl>
                      - name: Labels
                        value: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                    timeout: 5m
              - step:
                  type: JiraCreate
                  name: Create_Child_Vulnerability_Ticket
                  identifier: Create_Child_Vulnerability_Ticket
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_EXISTS> == "false" || <+pipeline.stages.Build_And_Scan.spec.execution.steps.Lookup_Existing_Jira_Epic.output.outputVariables.EPIC_STATUS> == "Done"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: <+pipeline.variables.jira_project_key>
                    issueType: <+pipeline.variables.jira_child_issue_type>
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: "[<+repeat.item.split(\"~\")[1]>] <+repeat.item.split(\"~\")[0]> in <+repeat.item.split(\"~\")[2]>"
                      - name: Description
                        value: |-
                          Advisory / CVE: <+repeat.item.split("~")[0]>
                          Severity: <+repeat.item.split("~")[1]>
                          Package: <+repeat.item.split("~")[2]>
                          Vulnerable range: <+repeat.item.split("~")[3]>
                          CVSS score: <+repeat.item.split("~")[4]>
                          Details: <+repeat.item.split("~")[5]>

                          Release: <+pipeline.variables.release_name>
                      - name: Parent
                        value: <+pipeline.stages.Jira_Automation.spec.execution.steps.Create_Parent_Release_Ticket.issue.key>
                    timeout: 5m
                    failureStrategies:
                      - onFailure:
                          errors:
                            - AllErrors
                          action:
                            type: MarkAsSuccess
                  strategy:
                    repeat:
                      items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS.split("@@@")>
                      maxConcurrency: 5
