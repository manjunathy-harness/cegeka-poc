pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  variables:
    - name: release_name
      type: String
      required: true
      value: <+input>
    - name: jira_project_key
      type: String
      required: false
      value: SCRUM
    - name: jira_parent_issue_type
      type: String
      required: false
      value: Epic
    - name: jira_child_issue_type
      type: String
      required: false
      value: Task
    - name: min_severity_for_demo
      type: String
      required: false
      value: low
    - name: run_mode
      type: String
      required: false
      value: <+input>.default(initial)
    - name: parent_issue_key
      type: String
      required: false
      value: <+input>.default(none)
  stages:
    - stage:
        name: Build_And_Scan
        identifier: Build_And_Scan
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      cd sample-app
                      npm install --package-lock-only
              - step:
                  type: Owasp
                  name: OWASP_Dependency_Check
                  identifier: OWASP_Dependency_Check
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      name: <+codebase.repoUrl>
                      variant: <+codebase.branch>
                      workspace: sample-app
                    advanced:
                      log:
                        level: info
                    privileged: true
              - step:
                  type: Run
                  name: Run_NPM_Audit
                  identifier: Run_NPM_Audit
                  spec:
                    shell: Sh
                    command: |-
                      cd sample-app

                      npm audit --json > /harness/npm-audit.json || true

                      cat /harness/npm-audit.json
              - step:
                  type: Run
                  name: Parse_Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      MIN_SEVERITY: <+pipeline.variables.min_severity_for_demo>
                    command: |-
                      set -e

                      SEVERITY_FLAG=""

                      if [ -n "$MIN_SEVERITY" ]; then
                        SEVERITY_FLAG="--min-severity $MIN_SEVERITY"
                      fi

                      python3 scripts/parse_npm_audit.py \
                        /harness/npm-audit.json \
                        "$RELEASE_NAME" \
                        $SEVERITY_FLAG \
                        > /harness/vuln_vars.env

                      echo "=============================================="
                      echo "Contents of vuln_vars.env"
                      echo "=============================================="

                      cat /harness/vuln_vars.env

                      echo "=============================================="

                      export RELEASE_NAME="$(grep '^RELEASE_NAME=' /harness/vuln_vars.env | cut -d= -f2-)"

                      export VULN_COUNT="$(grep '^VULN_COUNT=' /harness/vuln_vars.env | cut -d= -f2-)"

                      export VULN_ITEMS_1="$(grep '^VULN_ITEMS_1=' /harness/vuln_vars.env | cut -d= -f2-)"

                      export VULN_ITEMS_2="$(grep '^VULN_ITEMS_2=' /harness/vuln_vars.env | cut -d= -f2-)"

                      export VULN_ITEMS_3="$(grep '^VULN_ITEMS_3=' /harness/vuln_vars.env | cut -d= -f2-)"

                      export VULN_ITEMS_4="$(grep '^VULN_ITEMS_4=' /harness/vuln_vars.env | cut -d= -f2-)"

                      export VULN_ITEMS_5="$(grep '^VULN_ITEMS_5=' /harness/vuln_vars.env | cut -d= -f2-)"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "VULN_COUNT=$VULN_COUNT"

                      echo "VULN_ITEMS_1=$VULN_ITEMS_1"
                      echo "VULN_ITEMS_2=$VULN_ITEMS_2"
                      echo "VULN_ITEMS_3=$VULN_ITEMS_3"
                      echo "VULN_ITEMS_4=$VULN_ITEMS_4"
                      echo "VULN_ITEMS_5=$VULN_ITEMS_5"
                    outputVariables:
                      - name: RELEASE_NAME
                      - name: VULN_COUNT
                      - name: VULN_ITEMS_1
                      - name: VULN_ITEMS_2
                      - name: VULN_ITEMS_3
                      - name: VULN_ITEMS_4
                      - name: VULN_ITEMS_5
    - stage:
        name: Jira_Automation
        identifier: Jira_Automation
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: JiraCreate
                  name: Create_Parent_Release_Ticket
                  identifier: Create_Parent_Release_Ticket
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.run_mode> != "reverify" && <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: SCRUM
                    issueType: Epic
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: Security scan results - <+pipeline.variables.release_name> - <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> vulnerabilities found
                      - name: Description
                        value: |-
                          Automated security scan for release <+pipeline.variables.release_name>.

                          Total vulnerabilities found: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>

                          Each vulnerability has been filed as a linked child ticket below.

                          Pipeline execution: <+pipeline.executionUrl>
                  timeout: 5m
              - step:
                  type: JiraCreate
                  name: Create_Child_Vulnerability_Tickets_1
                  identifier: Create_Child_Vulnerability_Tickets_1
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS_1> != ""
                  spec:
                    connectorRef: cegekapocjira
                    projectKey: SCRUM
                    issueType: Task
                    fields:
                      - name: Reporter
                        value: manjunath.chavan2017@gmail.com
                      - name: Summary
                        value: "[<+repeat.item.split(\"##\")[1]>] <+repeat.item.split(\"##\")[0]> in <+repeat.item.split(\"##\")[2]>"
                      - name: Description
                        value: |-
                          Advisory / CVE: <+repeat.item.split("##")[0]>
                          Severity: <+repeat.item.split("##")[1]>
                          Package: <+repeat.item.split("##")[2]>
                          Vulnerable range: <+repeat.item.split("##")[3]>
                          CVSS score: <+repeat.item.split("##")[4]>
                          Details: <+repeat.item.split("##")[5]>

                          Release: <+pipeline.variables.release_name>
                      - name: Parent
                        value: <+pipeline.stages.Jira_Automation.spec.execution.steps.Create_Parent_Release_Ticket.issue.key>
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  strategy:
                    repeat:
                      items: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS_1.split("@@@")>
                      maxConcurrency: 1
              - step:
                  type: JiraCreate
                  name: Create_Child_Vulnerability_Tickets_2
                  identifier: Create_Child_Vulnerability_Tickets_2
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS_2> != ""
