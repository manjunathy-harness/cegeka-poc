pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  stages:
    - stage:
        name: Release_Queue
        identifier: Release_Queue
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Queue
                  name: Queue_Release_Version
                  identifier: Queue_Release_Version
                  spec:
                    key: cegeka-release-version
                    scope: Pipeline
                  timeout: 30m
              - step:
                  type: ShellScript
                  name: Test_GitHub_Secret
                  identifier: Test_GitHub_Secret
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e

                          echo "=============================================="
                          echo "GITHUB SECRET TEST"
                          echo "=============================================="

                          GITHUB_TOKEN='<+secrets.getValue("cegeka_github_pat")>'

                          if [ -z "$GITHUB_TOKEN" ]; then
                            echo "ERROR: GITHUB_TOKEN is EMPTY"
                            exit 1
                          fi

                          TOKEN_LENGTH="$(printf '%s' "$GITHUB_TOKEN" | wc -c | tr -d ' ')"
                          TOKEN_PREFIX="$(printf '%s' "$GITHUB_TOKEN" | cut -c1-11)"
                          TOKEN_SUFFIX="$(printf '%s' "$GITHUB_TOKEN" | tail -c 7)"

                          echo "Token length: $TOKEN_LENGTH"
                          echo "Token prefix: $TOKEN_PREFIX"
                          echo "Token suffix: $TOKEN_SUFFIX"

                          echo "=============================================="
                          echo "TESTING GITHUB AUTHENTICATION"
                          echo "=============================================="

                          HTTP_CODE="$(curl -sS \
                            -o /tmp/github-user.json \
                            -w "%{http_code}" \
                            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                            -H "Accept: application/vnd.github+json" \
                            -H "X-GitHub-Api-Version: 2022-11-28" \
                            https://api.github.com/user)"

                          echo "GitHub HTTP status: $HTTP_CODE"

                          if [ "$HTTP_CODE" != "200" ]; then
                            echo "=============================================="
                            echo "GITHUB AUTHENTICATION FAILED"
                            echo "=============================================="
                            cat /tmp/github-user.json
                            exit 1
                          fi

                          echo "=============================================="
                          echo "GITHUB AUTHENTICATION SUCCESS"
                          echo "=============================================="

                          python3 - <<'PY'
                          import json

                          with open("/tmp/github-user.json", "r") as f:
                              data = json.load(f)

                          print("GitHub user:", data.get("login", "unknown"))
                          PY

                          echo "=============================================="
                          echo "TESTING REPOSITORY ACCESS"
                          echo "=============================================="

                          REPO_HTTP_CODE="$(curl -sS \
                            -o /tmp/github-repo.json \
                            -w "%{http_code}" \
                            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                            -H "Accept: application/vnd.github+json" \
                            -H "X-GitHub-Api-Version: 2022-11-28" \
                            https://api.github.com/repos/manjunathy-harness/cegeka-poc)"

                          echo "Repository HTTP status: $REPO_HTTP_CODE"

                          if [ "$REPO_HTTP_CODE" != "200" ]; then
                            echo "=============================================="
                            echo "REPOSITORY ACCESS FAILED"
                            echo "=============================================="
                            cat /tmp/github-repo.json
                            exit 1
                          fi

                          echo "=============================================="
                          echo "REPOSITORY ACCESS SUCCESS"
                          echo "=============================================="

                          python3 - <<'PY'
                          import json

                          with open("/tmp/github-repo.json", "r") as f:
                              data = json.load(f)

                          print("Repository:", data.get("full_name", "unknown"))
                          print("Private:", data.get("private", "unknown"))
                          PY

                          echo "=============================================="
                          echo "ALL GITHUB TESTS PASSED"
                          echo "=============================================="
                  timeout: 10m
