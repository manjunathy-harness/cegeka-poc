pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        repoName: manjunathy-harness/cegeka-poc
        build: <+input>
  variables:
    - name: execution_mode
      type: String
      description: PR = build and scan only. WEEKLY_SCAN = vulnerability remediation workflow.
      required: true
      value: <+input>
    - name: release_name
      type: String
      description: Release name for weekly vulnerability remediation.
      required: false
      value: ""
  stages:
    - stage:
        name: Build And Scan
        identifier: Build_And_Scan
        description: Build and security scan
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    connectorRef: <+input>
                    image: node:20
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "INSTALL DEPENDENCIES"
                      echo "========================================="

                      npm ci

                      echo "Dependencies installed."
              - step:
                  type: Run
                  name: Build Application
                  identifier: Build_Application
                  spec:
                    connectorRef: <+input>
                    image: node:20
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "BUILD APPLICATION"
                      echo "========================================="

                      echo "Execution mode:"
                      echo "<+pipeline.variables.execution_mode>"

                      npm run build

                      echo "Build completed successfully."
              - step:
                  type: Run
                  name: Security Scan
                  identifier: Security_Scan
                  spec:
                    connectorRef: <+input>
                    image: node:20
                    shell: Bash
                    command: |
                      set +e

                      echo "========================================="
                      echo "SECURITY SCAN"
                      echo "========================================="

                      npm audit --json > /harness/npm-audit.json

                      AUDIT_EXIT_CODE=$?

                      echo "npm audit exit code: $AUDIT_EXIT_CODE"

                      # Do NOT fail here.
                      #
                      # We intentionally allow the scan to complete
                      # because:
                      #
                      # PR:
                      #   vulnerability -> fail PR pipeline
                      #
                      # WEEKLY_SCAN:
                      #   vulnerability -> Jira/security branch flow

                      exit 0
              - step:
                  type: Run
                  name: Parse Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    connectorRef: <+input>
                    image: python:3.11
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "PARSE VULNERABILITIES"
                      echo "========================================="

                      python3 scripts/parse_npm_audit.py \
                        --input /harness/npm-audit.json

                      echo "Vulnerability parsing completed."
                    outputVariables:
                      - name: VULN_COUNT
                        type: String
                        value: VULN_COUNT
                      - name: VULN_ITEMS
                        type: String
                        value: VULN_ITEMS
              - step:
                  type: Run
                  name: PR Vulnerability Gate
                  identifier: PR_Vulnerability_Gate
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.execution_mode> == "PR"
                  spec:
                    connectorRef: <+input>
                    image: alpine:3.20
                    shell: Sh
                    command: |
                      set -e

                      echo "========================================="
                      echo "PR SECURITY GATE"
                      echo "========================================="

                      VULN_COUNT="<+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>"

                      echo "Vulnerabilities found: $VULN_COUNT"

                      if [ "$VULN_COUNT" != "0" ]; then

                        echo ""
                        echo "========================================="
                        echo "SECURITY VALIDATION FAILED"
                        echo "========================================="
                        echo ""
                        echo "Vulnerabilities were detected."
                        echo ""
                        echo "This PR will NOT:"
                        echo "  - Create a Jira Epic"
                        echo "  - Create a Jira child ticket"
                        echo "  - Create a security branch"
                        echo "  - Enter Jira automation"
                        echo ""
                        echo "Developer must fix the vulnerabilities."
                        echo ""
                        exit 1
                      fi

                      echo ""
                      echo "No vulnerabilities found."
                      echo "PR security validation PASSED."
              - step:
                  type: Run
                  name: Generate Release Name
                  identifier: Generate_Release_Name
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.execution_mode> == "WEEKLY_SCAN"
                  spec:
                    connectorRef: <+input>
                    image: alpine:3.20
                    shell: Sh
                    command: |
                      set -e

                      RELEASE_NAME="release-$(date +%Y.%m.%d)"

                      echo "Weekly release:"
                      echo "$RELEASE_NAME"

                      echo "RELEASE_NAME=$RELEASE_NAME" >> "$HARNESS_ENV_EXPORT"
                    outputVariables:
                      - name: RELEASE_NAME
                        type: String
                        value: RELEASE_NAME
              - step:
                  type: Run
                  name: Weekly Vulnerability Decision
                  identifier: Weekly_Vulnerability_Decision
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.execution_mode> == "WEEKLY_SCAN"
                  spec:
                    connectorRef: <+input>
                    image: alpine:3.20
                    shell: Sh
                    command: |
                      set -e

                      VULN_COUNT="<+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>"

                      echo "========================================="
                      echo "WEEKLY VULNERABILITY SCAN"
                      echo "========================================="

                      echo "Vulnerabilities found: $VULN_COUNT"

                      if [ "$VULN_COUNT" = "0" ]; then
                        echo ""
                        echo "No vulnerabilities found."
                        echo "No Jira Epic will be created."
                        echo "No security branch will be created."
                        echo ""
                      else
                        echo ""
                        echo "Vulnerabilities detected."
                        echo "Entering weekly remediation workflow."
                        echo ""
                      fi
    - stage:
        name: Weekly Remediation
        identifier: Weekly_Remediation
        description: Create Jira remediation work and security branch for weekly scan vulnerabilities.
        type: Custom
        when:
          pipelineStatus: Success
          condition: |
            <+pipeline.variables.execution_mode> == "WEEKLY_SCAN"
            &&
            <+execution.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
        spec:
          execution:
            steps:
              - step:
                  type: Run
                  name: Check Existing Remediation
                  identifier: Check_Existing_Remediation
                  spec:
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "CHECK EXISTING REMEDIATION"
                      echo "========================================="

                      echo "Release:"
                      echo "<+execution.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Name.output.outputVariables.RELEASE_NAME>"

                      echo ""
                      echo "The weekly scan must check whether an open"
                      echo "remediation already exists before creating"
                      echo "new Jira/branch work."
                      echo ""

                      # IMPORTANT:
                      #
                      # Put your existing Jira lookup/API logic here.
                      #
                      # Expected output:
                      #
                      # EXISTING_EPIC=true/false
                      #
                      # If an existing remediation is open:
                      #   update existing Epic
                      #
                      # If no open remediation exists:
                      #   create new Epic + security branch
              - step:
                  type: Run
                  name: Jira Remediation
                  identifier: Jira_Remediation
                  spec:
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "JIRA REMEDIATION"
                      echo "========================================="

                      VULN_COUNT="<+execution.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>"

                      RELEASE_NAME="<+execution.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Name.output.outputVariables.RELEASE_NAME>"

                      echo "Release: $RELEASE_NAME"
                      echo "Vulnerability count: $VULN_COUNT"

                      echo ""
                      echo "Weekly scan is the ONLY source that"
                      echo "creates Jira remediation work."
                      echo ""

                      # Keep your existing Jira automation/API
                      # implementation here.
                      #
                      # Logic:
                      #
                      # IF existing open Epic exists:
                      #
                      #     update existing Epic
                      #     add only newly discovered vulnerabilities
                      #
                      # ELSE:
                      #
                      #     create new Epic
                      #     create child vulnerability tickets
              - step:
                  type: Run
                  name: Create Security Branch
                  identifier: Create_Security_Branch
                  spec:
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "CREATE SECURITY BRANCH"
                      echo "========================================="

                      RELEASE_NAME="<+execution.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Name.output.outputVariables.RELEASE_NAME>"

                      echo "Release:"
                      echo "$RELEASE_NAME"

                      # IMPORTANT:
                      #
                      # Security branch creation happens ONLY here.
                      #
                      # PR executions NEVER reach this stage.
                      #
                      # Branch naming example:
                      #
                      # security/<release-name>
                      #
                      # Example:
                      #
                      # security/release-2026.09.21

                      BRANCH_NAME="security/$RELEASE_NAME"

                      echo "Security branch:"
                      echo "$BRANCH_NAME"

                      echo ""
                      echo "Use your existing GitHub branch creation"
                      echo "implementation here."
              - step:
                  type: Run
                  name: Create Vulnerability Tickets
                  identifier: Create_Vulnerability_Tickets
                  spec:
                    shell: Bash
                    command: |
                      set -e

                      echo "========================================="
                      echo "CREATE VULNERABILITY TICKETS"
                      echo "========================================="

                      echo "Vulnerability list:"
                      echo "<+execution.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS>"

                      echo ""
                      echo "Your existing Jira child-ticket"
                      echo "creation logic should process the"
                      echo "vulnerability list here."

                      # IMPORTANT:
                      #
                      # Do NOT create duplicate tickets.
                      #
                      # For every vulnerability:
                      #
                      #   if already associated with an OPEN
                      #   remediation Epic:
                      #
                      #       do nothing
                      #
                      #   if NEW:
                      #
                      #       create child ticket
              - step:
                  type: Run
                  name: Weekly Remediation Summary
                  identifier: Weekly_Remediation_Summary
                  spec:
                    shell: Bash
                    command: |
                      echo ""
                      echo "========================================="
                      echo "WEEKLY REMEDIATION WORKFLOW"
                      echo "========================================="
                      echo ""
                      echo "Execution mode:"
                      echo "<+pipeline.variables.execution_mode>"
                      echo ""
                      echo "Release:"
                      echo "<+execution.stages.Build_And_Scan.spec.execution.steps.Generate_Release_Name.output.outputVariables.RELEASE_NAME>"
                      echo ""
                      echo "Vulnerabilities:"
                      echo "<+execution.stages.Build_And_Scan.spec.execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>"
                      echo ""
                      echo "Jira remediation:"
                      echo "CREATED OR UPDATED"
                      echo ""
                      echo "Security branch:"
                      echo "CREATED OR UPDATED"
                      echo ""
                      echo "========================================="
    - stage:
        name: Continue
        identifier: Continue
        description: Continue to the next application stage.
        type: Custom
        when:
          pipelineStatus: Success
        spec:
          execution:
            steps:
              - step:
                  type: Run
                  name: Pipeline Summary
                  identifier: Pipeline_Summary
                  spec:
                    shell: Bash
                    command: |
                      echo ""
                      echo "========================================="
                      echo "PIPELINE SUMMARY"
                      echo "========================================="
                      echo ""
                      echo "Execution mode:"
                      echo "<+pipeline.variables.execution_mode>"
                      echo ""

                      if [ "<+pipeline.variables.execution_mode>" = "PR" ]; then
                        echo "PR FLOW:"
                        echo "Build -> Scan -> Security Gate"
                        echo ""
                        echo "No Jira automation."
                        echo "No security branch."
                      else
                        echo "WEEKLY FLOW:"
                        echo "Build -> Scan -> Jira -> Security Branch"
                      fi

                      echo ""
                      echo "========================================="
