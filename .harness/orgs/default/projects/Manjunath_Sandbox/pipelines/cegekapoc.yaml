pipeline:
  name: cegeka-poc
  identifier: cegekapoc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: cegekapoc
        build: <+input>
  variables:
    - name: release_name
      type: String
      required: true
      value: <+input>
    - name: jira_project_key
      type: String
      required: false
      value: SCRUM
    - name: jira_parent_issue_type
      type: String
      required: false
      value: Epic
    - name: jira_child_issue_type
      type: String
      required: false
      value: Task
    - name: min_severity_for_demo
      type: String
      required: false
      value: low
  stages:
    - stage:
        name: Build_And_Scan
        identifier: Build_And_Scan
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "INSTALLING DEPENDENCIES"
                      echo "=============================================="

                      cd sample-app

                      npm install --package-lock-only

                      echo ""
                      echo "Dependencies prepared."
              - step:
                  type: Owasp
                  name: OWASP_Dependency_Check
                  identifier: OWASP_Dependency_Check
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      name: <+codebase.repoUrl>
                      variant: <+codebase.branch>
                      workspace: sample-app
                    advanced:
                      log:
                        level: info
                    privileged: true
              - step:
                  type: Run
                  name: Run_NPM_Audit
                  identifier: Run_NPM_Audit
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "RUNNING NPM AUDIT"
                      echo "=============================================="

                      cd sample-app

                      npm audit --json > /harness/npm-audit.json || true

                      echo ""
                      echo "=============================================="
                      echo "NPM AUDIT RESULT"
                      echo "=============================================="

                      cat /harness/npm-audit.json
              - step:
                  type: Run
                  name: Parse_Vulnerabilities
                  identifier: Parse_Vulnerabilities
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      MIN_SEVERITY: <+pipeline.variables.min_severity_for_demo>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "PARSING VULNERABILITIES"
                      echo "=============================================="

                      SEVERITY_FLAG=""

                      if [ -n "$MIN_SEVERITY" ]; then
                        SEVERITY_FLAG="--min-severity $MIN_SEVERITY"
                      fi

                      python3 scripts/parse_npm_audit.py \
                        /harness/npm-audit.json \
                        "$RELEASE_NAME" \
                        $SEVERITY_FLAG \
                        > /harness/vuln_vars.env

                      echo ""
                      echo "=============================================="
                      echo "PARSED VULNERABILITY VARIABLES"
                      echo "=============================================="

                      cat /harness/vuln_vars.env

                      export RELEASE_NAME="$(grep '^RELEASE_NAME=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_COUNT="$(grep '^VULN_COUNT=' /harness/vuln_vars.env | cut -d= -f2-)"
                      export VULN_ITEMS="$(grep '^VULN_ITEMS=' /harness/vuln_vars.env | cut -d= -f2-)"

                      echo ""
                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "VULN_COUNT=$VULN_COUNT"
                      echo "VULN_ITEMS=$VULN_ITEMS"
                    outputVariables:
                      - name: RELEASE_NAME
                      - name: VULN_COUNT
                      - name: VULN_ITEMS
              - step:
                  type: Run
                  name: Generate_Release_Label
                  identifier: Generate_Release_Label
                  spec:
                    shell: Sh
                    envVariables:
                      RELEASE_NAME: <+pipeline.variables.release_name>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "GENERATING RELEASE LABEL"
                      echo "=============================================="

                      SAFE_RELEASE_NAME="$(echo "$RELEASE_NAME" \
                        | tr '[:upper:]' '[:lower:]' \
                        | sed 's/[^a-z0-9]/-/g' \
                        | sed 's/--*/-/g' \
                        | sed 's/^-//; s/-$//')"

                      RELEASE_LABEL="security-release-${SAFE_RELEASE_NAME}"

                      echo "RELEASE_NAME=$RELEASE_NAME"
                      echo "RELEASE_LABEL=$RELEASE_LABEL"

                      export RELEASE_LABEL
                    outputVariables:
                      - name: RELEASE_LABEL
              - step:
                  type: Run
                  name: Lookup_Existing_Jira_Epic
                  identifier: Lookup_Existing_Jira_Epic
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    shell: Sh
                    envVariables:
                      JIRA_API_BASE: https://api.atlassian.com/ex/jira/e7275a1a-f6bd-4b41-af99-c35820ea031b/rest/api/3
                      JIRA_EMAIL: <+secrets.getValue("cegeka_jira_email")>
                      JIRA_API_TOKEN: <+secrets.getValue("cegeka-poc-jira")>
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      RELEASE_LABEL: <+execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                      JIRA_PROJECT_KEY: <+pipeline.variables.jira_project_key>
                    command: |-
                      set -e

                      echo "=============================================="
                      echo "JIRA AUTHENTICATION"
                      echo "=============================================="

                      python3 - <<'PY'
                      import os
                      import json
                      import base64
                      import urllib.request
                      import urllib.error

                      base = os.environ["JIRA_API_BASE"]
                      email = os.environ["JIRA_EMAIL"]
                      token = os.environ["JIRA_API_TOKEN"]

                      credentials = f"{email}:{token}".encode()
                      auth = base64.b64encode(credentials).decode()

                      request = urllib.request.Request(
                          f"{base}/myself",
                          method="GET",
                          headers={
                              "Authorization": f"Basic {auth}",
                              "Accept": "application/json"
                          }
                      )

                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              data = json.loads(response.read().decode())

                          print("Jira authentication successful.")
                          print(f"Authenticated user: {data.get('displayName', '')}")
                          print(f"Account ID: {data.get('accountId', '')}")
                          print(f"Email: {data.get('emailAddress', '')}")

                      except urllib.error.HTTPError as e:
                          body = e.read().decode(errors="replace")
                          print(f"Jira authentication failed: HTTP {e.code}")
                          print(body)
                          raise SystemExit(1)
                      PY

                      echo ""
                      echo "=============================================="
                      echo "JIRA EPIC LOOKUP"
                      echo "=============================================="

                      export RELEASE_NAME
                      export RELEASE_LABEL
                      export JIRA_PROJECT_KEY

                      python3 - <<'PY'
                      import os
                      import json
                      import base64
                      import urllib.request
                      import urllib.error
                      import urllib.parse

                      base = os.environ["JIRA_API_BASE"]
                      email = os.environ["JIRA_EMAIL"]
                      token = os.environ["JIRA_API_TOKEN"]

                      release_name = os.environ["RELEASE_NAME"].strip()
                      release_label = os.environ["RELEASE_LABEL"].strip()
                      project_key = os.environ["JIRA_PROJECT_KEY"].strip()

                      credentials = f"{email}:{token}".encode()
                      auth = base64.b64encode(credentials).decode()

                      headers = {
                          "Authorization": f"Basic {auth}",
                          "Accept": "application/json",
                          "Content-Type": "application/json"
                      }

                      jql = (
                          f'project = "{project_key}" '
                          f'AND issuetype = Epic '
                          f'ORDER BY created DESC'
                      )

                      body = {
                          "jql": jql,
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "status",
                              "issuetype",
                              "labels"
                          ]
                      }

                      request = urllib.request.Request(
                          f"{base}/search/jql",
                          data=json.dumps(body).encode(),
                          method="POST",
                          headers=headers
                      )

                      try:
                          with urllib.request.urlopen(request, timeout=60) as response:
                              data = json.loads(response.read().decode())

                      except urllib.error.HTTPError as e:
                          response_body = e.read().decode(errors="replace")

                          print("")
                          print("ERROR: Jira search failed.")
                          print(f"HTTP STATUS: {e.code}")
                          print(response_body)

                          raise SystemExit(1)

                      issues = data.get("issues", [])

                      print(f"TOTAL_EPICS_RETURNED={len(issues)}")
                      print("")

                      matched = None

                      for issue in issues:

                          fields = issue.get("fields", {})

                          key = issue.get("key", "")

                          summary = fields.get("summary", "") or ""

                          status = (
                              fields.get("status", {}) or {}
                          ).get("name", "")

                          issue_type = (
                              fields.get("issuetype", {}) or {}
                          ).get("name", "")

                          labels = fields.get("labels", []) or []

                          print(
                              f"EPIC_CHECK "
                              f"key={key} "
                              f"type={issue_type} "
                              f"status={status} "
                              f"summary={summary}"
                          )

                          if issue_type.lower() != "epic":
                              continue

                          summary_match = (
                              release_name.lower()
                              in summary.lower()
                          )

                          label_match = any(
                              str(label).lower() == release_label.lower()
                              for label in labels
                          )

                          if summary_match or label_match:
                              matched = {
                                  "key": key,
                                  "summary": summary,
                                  "status": status
                              }

                              break

                      print("")
                      print("==============================================")
                      print("FINAL JIRA LOOKUP RESULT")
                      print("==============================================")

                      if matched:
                          print("EPIC_EXISTS=true")
                          print(f"EPIC_KEY={matched['key']}")
                          print(f"EPIC_STATUS={matched['status']}")
                          print(f"EPIC_SUMMARY={matched['summary']}")

                      else:
                          print("EPIC_EXISTS=false")
                          print("EPIC_KEY=")
                          print("EPIC_STATUS=")
                          print("EPIC_SUMMARY=")
                      PY
              - step:
                  type: Run
                  name: Jira_Automation_Final
                  identifier: Jira_Automation_Final
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT> != "0"
                  spec:
                    shell: Sh
                    envVariables:
                      JIRA_API_BASE: https://api.atlassian.com/ex/jira/e7275a1a-f6bd-4b41-af99-c35820ea031b/rest/api/3
                      JIRA_EMAIL: <+secrets.getValue("cegeka_jira_email")>
                      JIRA_API_TOKEN: <+secrets.getValue("cegeka-poc-jira")>
                      JIRA_PROJECT_KEY: <+pipeline.variables.jira_project_key>
                      PARENT_ISSUE_TYPE: <+pipeline.variables.jira_parent_issue_type>
                      CHILD_ISSUE_TYPE: <+pipeline.variables.jira_child_issue_type>
                      RELEASE_NAME: <+pipeline.variables.release_name>
                      RELEASE_LABEL: <+execution.steps.Generate_Release_Label.output.outputVariables.RELEASE_LABEL>
                      VULN_COUNT: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_COUNT>
                      VULN_ITEMS: <+execution.steps.Parse_Vulnerabilities.output.outputVariables.VULN_ITEMS>
                    command: |-
                      set -e

                      echo "============================================================"
                      echo "FINAL JIRA AUTOMATION"
                      echo "============================================================"

                      echo "Release       : $RELEASE_NAME"
                      echo "Project       : $JIRA_PROJECT_KEY"
                      echo "Vulnerabilities: $VULN_COUNT"
                      echo "Release label : $RELEASE_LABEL"

                      python3 - <<'PY'
                      import os
                      import json
                      import base64
                      import urllib.request
                      import urllib.error
                      import time

                      BASE = os.environ["JIRA_API_BASE"]
                      EMAIL = os.environ["JIRA_EMAIL"]
                      TOKEN = os.environ["JIRA_API_TOKEN"]

                      PROJECT = os.environ["JIRA_PROJECT_KEY"]

                      PARENT_TYPE = os.environ["PARENT_ISSUE_TYPE"]
                      CHILD_TYPE = os.environ["CHILD_ISSUE_TYPE"]

                      RELEASE_NAME = os.environ["RELEASE_NAME"]
                      RELEASE_LABEL = os.environ["RELEASE_LABEL"]

                      VULN_COUNT = os.environ["VULN_COUNT"]
                      VULN_ITEMS = os.environ["VULN_ITEMS"]

                      credentials = f"{EMAIL}:{TOKEN}".encode()
                      auth = base64.b64encode(credentials).decode()

                      HEADERS = {
                          "Authorization": f"Basic {auth}",
                          "Accept": "application/json",
                          "Content-Type": "application/json"
                      }


                      # ========================================================
                      # HTTP helper
                      # ========================================================

                      def jira_request(
                          method,
                          path,
                          payload=None,
                          expected_codes=None
                      ):

                          url = f"{BASE}{path}"

                          data = None

                          if payload is not None:
                              data = json.dumps(payload).encode()

                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers=HEADERS
                          )

                          try:
                              with urllib.request.urlopen(
                                  request,
                                  timeout=60
                              ) as response:

                                  raw = response.read().decode()

                                  if raw:
                                      return response.status, json.loads(raw)

                                  return response.status, {}

                          except urllib.error.HTTPError as e:

                              raw = e.read().decode(
                                  errors="replace"
                              )

                              print("")
                              print("JIRA API ERROR")
                              print(f"Method: {method}")
                              print(f"URL: {url}")
                              print(f"HTTP: {e.code}")
                              print(raw)

                              raise


                      # ========================================================
                      # Authentication check
                      # ========================================================

                      print("")
                      print("============================================================")
                      print("1. VERIFY JIRA AUTHENTICATION")
                      print("============================================================")

                      status, myself = jira_request(
                          "GET",
                          "/myself"
                      )

                      print(
                          f"Authenticated as: "
                          f"{myself.get('displayName', '')}"
                      )

                      print(
                          f"Account ID: "
                          f"{myself.get('accountId', '')}"
                      )


                      # ========================================================
                      # Search existing Epics
                      # ========================================================

                      print("")
                      print("============================================================")
                      print("2. SEARCH EXISTING RELEASE EPICS")
                      print("============================================================")

                      jql = (
                          f'project = "{PROJECT}" '
                          f'AND issuetype = Epic '
                          f'ORDER BY created DESC'
                      )

                      search_payload = {
                          "jql": jql,
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "status",
                              "issuetype",
                              "labels"
                          ]
                      }

                      status, search_result = jira_request(
                          "POST",
                          "/search/jql",
                          search_payload
                      )

                      issues = search_result.get(
                          "issues",
                          []
                      )

                      print(
                          f"Total Epics returned: "
                          f"{len(issues)}"
                      )

                      existing_epic = None

                      for issue in issues:

                          fields = issue.get(
                              "fields",
                              {}
                          )

                          key = issue.get(
                              "key",
                              ""
                          )

                          summary = fields.get(
                              "summary",
                              ""
                          ) or ""

                          issue_status = (
                              fields.get(
                                  "status",
                                  {}
                              ) or {}
                          ).get(
                              "name",
                              ""
                          )

                          issue_type = (
                              fields.get(
                                  "issuetype",
                                  {}
                              ) or {}
                          ).get(
                              "name",
                              ""
                          )

                          labels = fields.get(
                              "labels",
                              []
                          ) or []

                          if issue_type.lower() != "epic":
                              continue

                          summary_match = (
                              RELEASE_NAME.lower()
                              in summary.lower()
                          )

                          label_match = any(
                              str(label).lower()
                              == RELEASE_LABEL.lower()
                              for label in labels
                          )

                          if summary_match or label_match:

                              existing_epic = {
                                  "key": key,
                                  "summary": summary,
                                  "status": issue_status
                              }

                              break


                      # ========================================================
                      # Determine parent Epic
                      # ========================================================

                      parent_key = None

                      if existing_epic:

                          print("")
                          print(
                              f"Existing release Epic found: "
                              f"{existing_epic['key']}"
                          )

                          print(
                              f"Existing Epic status: "
                              f"{existing_epic['status']}"
                          )

                          if existing_epic["status"].lower() != "done":

                              parent_key = existing_epic["key"]

                              print("")
                              print(
                                  "ACTIVE EPIC FOUND."
                              )

                              print(
                                  f"REUSING EPIC: {parent_key}"
                              )

                          else:

                              print("")
                              print(
                                  "Existing Epic is Done."
                              )

                              print(
                                  "A new Epic will be created."
                              )


                      # ========================================================
                      # Create new Epic when necessary
                      # ========================================================

                      if not parent_key:

                          print("")
                          print("============================================================")
                          print("3. CREATE NEW RELEASE EPIC")
                          print("============================================================")

                          summary = (
                              f"Security scan results - "
                              f"{RELEASE_NAME} - "
                              f"{VULN_COUNT} vulnerabilities found"
                          )

                          description_text = (
                              f"Automated security scan for release "
                              f"{RELEASE_NAME}.\n\n"
                              f"Total vulnerabilities found: "
                              f"{VULN_COUNT}\n\n"
                              f"This Epic contains the vulnerability "
                              f"tickets generated by the Harness pipeline."
                          )

                          description = {
                              "type": "doc",
                              "version": 1,
                              "content": [
                                  {
                                      "type": "paragraph",
                                      "content": [
                                          {
                                              "type": "text",
                                              "text": description_text
                                          }
                                      ]
                                  }
                              ]
                          }

                          create_payload = {
                              "fields": {
                                  "project": {
                                      "key": PROJECT
                                  },
                                  "issuetype": {
                                      "name": PARENT_TYPE
                                  },
                                  "summary": summary,
                                  "description": description,
                                  "labels": [
                                      RELEASE_LABEL
                                  ]
                              }
                          }

                          status, created = jira_request(
                              "POST",
                              "/issue",
                              create_payload
                          )

                          parent_key = created.get(
                              "key"
                          )

                          if not parent_key:

                              print(
                                  "ERROR: Jira did not return "
                                  "the created Epic key."
                              )

                              print(created)

                              raise SystemExit(1)

                          print("")
                          print(
                              f"NEW EPIC CREATED: {parent_key}"
                          )

                          # Give Jira a moment to make the new issue
                          # immediately searchable.
                          time.sleep(2)

                      else:

                          print("")
                          print("============================================================")
                          print("3. REUSING EXISTING EPIC")
                          print("============================================================")

                          print(
                              f"Parent Epic: {parent_key}"
                          )


                      # ========================================================
                      # Parse vulnerability items
                      # ========================================================

                      print("")
                      print("============================================================")
                      print("4. PARSE VULNERABILITY ITEMS")
                      print("============================================================")

                      raw_items = VULN_ITEMS.split("@@@")

                      vulnerability_items = []

                      for item in raw_items:

                          item = item.strip()

                          if not item:
                              continue

                          parts = item.split("~", 5)

                          while len(parts) < 6:
                              parts.append("")

                          advisory = parts[0]
                          severity = parts[1]
                          package = parts[2]
                          vulnerable_range = parts[3]
                          cvss = parts[4]
                          details = parts[5]

                          vulnerability_items.append({
                              "advisory": advisory,
                              "severity": severity,
                              "package": package,
                              "range": vulnerable_range,
                              "cvss": cvss,
                              "details": details
                          })


                      print(
                          f"Parsed vulnerability items: "
                          f"{len(vulnerability_items)}"
                      )


                      # ========================================================
                      # Find existing child tickets
                      #
                      # This prevents duplicate Tasks if the same pipeline
                      # is executed again against the same active Epic.
                      # ========================================================

                      print("")
                      print("============================================================")
                      print("5. CHECK EXISTING VULNERABILITY TASKS")
                      print("============================================================")

                      child_jql = (
                          f'project = "{PROJECT}" '
                          f'AND parent = "{parent_key}" '
                          f'ORDER BY created ASC'
                      )

                      child_payload = {
                          "jql": child_jql,
                          "maxResults": 100,
                          "fields": [
                              "summary",
                              "parent",
                              "labels"
                          ]
                      }

                      try:

                          status, child_result = jira_request(
                              "POST",
                              "/search/jql",
                              child_payload
                          )

                          existing_children = (
                              child_result.get(
                                  "issues",
                                  []
                              )
                          )

                      except Exception:

                          print(
                              "WARNING: Could not search existing "
                              "child tickets."
                          )

                          print(
                              "Continuing with child creation."
                          )

                          existing_children = []


                      existing_summaries = set()

                      for issue in existing_children:

                          summary = (
                              issue.get(
                                  "fields",
                                  {}
                              ).get(
                                  "summary",
                                  ""
                              )
                          )

                          if summary:
                              existing_summaries.add(
                                  summary.strip().lower()
                              )


                      print(
                          f"Existing child tickets found: "
                          f"{len(existing_children)}"
                      )


                      # ========================================================
                      # Create vulnerability Tasks
                      # ========================================================

                      print("")
                      print("============================================================")
                      print("6. CREATE VULNERABILITY TASKS")
                      print("============================================================")

                      created_count = 0
                      skipped_count = 0

                      for index, vuln in enumerate(
                          vulnerability_items,
                          start=1
                      ):

                          advisory = vuln["advisory"]
                          severity = vuln["severity"]
                          package = vuln["package"]
                          vulnerable_range = vuln["range"]
                          cvss = vuln["cvss"]
                          details = vuln["details"]

                          child_summary = (
                              f"[{severity}] "
                              f"{advisory} "
                              f"in {package}"
                          )

                          print("")
                          print(
                              f"Vulnerability {index}/"
                              f"{len(vulnerability_items)}"
                          )

                          print(
                              f"Summary: {child_summary}"
                          )

                          # --------------------------------------------
                          # Duplicate protection
                          # --------------------------------------------

                          if (
                              child_summary.strip().lower()
                              in existing_summaries
                          ):

                              print(
                                  "SKIPPING: "
                                  "Child ticket already exists."
                              )

                              skipped_count += 1

                              continue


                          description_text = (
                              f"Advisory / CVE: {advisory}\n"
                              f"Severity: {severity}\n"
                              f"Package: {package}\n"
                              f"Vulnerable range: "
                              f"{vulnerable_range}\n"
                              f"CVSS score: {cvss}\n"
                              f"Details: {details}\n\n"
                              f"Release: {RELEASE_NAME}\n"
                              f"Parent Epic: {parent_key}"
                          )

                          description = {
                              "type": "doc",
                              "version": 1,
                              "content": [
                                  {
                                      "type": "paragraph",
                                      "content": [
                                          {
                                              "type": "text",
                                              "text": description_text
                                          }
                                      ]
                                  }
                              ]
                          }

                          child_payload = {
                              "fields": {
                                  "project": {
                                      "key": PROJECT
                                  },
                                  "issuetype": {
                                      "name": CHILD_TYPE
                                  },
                                  "summary": child_summary,
                                  "description": description,
                                  "parent": {
                                      "key": parent_key
                                  },
                                  "labels": [
                                      RELEASE_LABEL
                                  ]
                              }
                          }

                          try:

                              status, created_child = jira_request(
                                  "POST",
                                  "/issue",
                                  child_payload
                              )

                              child_key = created_child.get(
                                  "key"
                              )

                              if not child_key:

                                  print(
                                      "ERROR: Jira did not return "
                                      "a child issue key."
                                  )

                                  print(created_child)

                                  raise SystemExit(1)

                              print(
                                  f"CREATED: {child_key}"
                              )

                              created_count += 1

                              existing_summaries.add(
                                  child_summary.strip().lower()
                              )

                          except urllib.error.HTTPError:

                              print("")
                              print(
                                  "ERROR: Failed creating "
                                  f"vulnerability {index}."
                              )

                              raise


