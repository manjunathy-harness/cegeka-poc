pipeline:
  name: deploy-svc
  identifier: deploysvc
  projectIdentifier: Manjunath_Sandbox
  orgIdentifier: default
  tags: {}
  description: |
    Deploy a vulnerability patch for several services to ONE environment.

    - No lifecycle: at Run time pick the ONE stage (= environment) to execute.
    - The stage uses Harness multi-service deployment with parallel service strategy.
    - Infrastructure requires maxConcurrency = 1, so Harness schedules one service at a time
      while retaining the multi-service parallel strategy and per-service failure isolation.
    - In parallel multi-service mode, a failed service does NOT block the other services.
    - Each service is represented separately in the stage view: green = patched,
      red = failed and rolled back (PR reverted).

    Input "patches" format: <serviceId>:<tag>,<serviceId>:<tag>   (no spaces)
    e.g. orders:1.8.3-p1,payments:2.4.1-p1,billing:3.0.9-p2
  allowStageExecutions: true
  variables:
    - name: patches
      type: String
      description: Comma-separated serviceId:tag pairs, no spaces
      required: true
      value: <+input>
    - name: imageRepo
      type: String
      description: Registry namespace. Image = <imageRepo>/<service.variables.imageName>:<tag>
      required: true
      value: pkg.harness.io/am8hcbditxgqnrtihnl7qq/sruthi-docker
    - name: gitopsAgentId
      type: String
      required: true
      value: <+input>
    - name: gitopsCluster
      type: String
      required: true
      value: <+input>
  stages:
    - stage:
        name: Deploy Dev
        identifier: deploy_dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          services:
            values:
              - serviceRef: orders
              - serviceRef: payments
              - serviceRef: billing
            metadata:
              parallel: true
          multiDeploymentConfig:
            maxConcurrency: 1
          environment:
            environmentRef: dev
            deployToAll: false
            gitOpsClusters:
              - identifier: <+pipeline.variables.gitopsCluster>
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Resolve Patch Tag
                  identifier: resolve_patch_tag
                  timeout: 5m
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          SERVICE_ID="<+service.identifier>"
                          PATCHES="<+pipeline.variables.patches>"

                          PATCH_TAG="$(printf '%s\n' "$PATCHES" | tr ',' '\n' | awk -F: -v svc="$SERVICE_ID" '$1 == svc {print $2; exit}')"

                          if [ -z "$PATCH_TAG" ]; then
                            echo "No patch tag found for service: $SERVICE_ID"
                            exit 1
                          fi

                          echo "Resolved patch tag for $SERVICE_ID: $PATCH_TAG"
                          echo "PATCH_TAG=$PATCH_TAG" >> "$HARNESS_OUTPUT_PATH"
                    environmentVariables: []
                    outputVariables:
                      - name: PATCH_TAG
                        type: String
                        value: PATCH_TAG
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: update_release_repo
                  timeout: 10m
                  spec:
                    variables:
                      - name: spec.template.spec.containers[0].image
                        type: String
                        value: <+pipeline.variables.imageRepo>/<+service.variables.imageName>:<+execution.steps.resolve_patch_tag.output.outputVariables.PATCH_TAG>
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: merge_pr
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: squash
                    variables: []
              - step:
                  type: GitOpsSync
                  name: Sync App
                  identifier: sync_app
                  timeout: 15m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList:
                      - applicationName: <+service.variables.gitopsAppPrefix>-<+env.identifier>
                        agentId: <+pipeline.variables.gitopsAgentId>
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: true
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revert_pr
                  timeout: 10m
                  spec:
                    commitId: <+execution.steps.update_release_repo.updateReleaseRepoOutcome.commitId>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Deploy Test
        identifier: deploy_test
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          services:
            values:
              - serviceRef: orders
