inputSet:
  name: cegeka-jira-trigger
  identifier: cegeka_jira_trigger
  orgIdentifier: default
  projectIdentifier: Manjunath_Sandbox

  pipeline:
    identifier: cegekapoc

    properties:
      ci:
        codebase:
          build:
            type: branch
            spec:
              branch: main

    variables:
      - name: release_name
        type: String
        value: <+trigger.payload.release_name>
